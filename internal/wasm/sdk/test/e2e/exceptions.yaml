# Exception Format is <test name>: <reason>
"data/toplevel integer": "https://github.com/open-policy-agent/opa/issues/3711"
"data/nested integer": "https://github.com/open-policy-agent/opa/issues/3711"
"strings/format_int: bignum exact (>64-bit integer, all bases + negative)": "WASM cannot represent integers larger than 64 bits (see https://github.com/open-policy-agent/opa/issues/3711); this change fixes the Go topdown builtin."
"arithmetic/bignum exact (>64-bit integers through plus, minus, multiply)": "WASM cannot represent integers larger than 64 bits (see https://github.com/open-policy-agent/opa/issues/3711); this change fixes the Go topdown builtins."
"aggregates/bignum exact (>64-bit integers through sum and product)": "WASM cannot represent integers larger than 64 bits (see https://github.com/open-policy-agent/opa/issues/3711); this change fixes the Go topdown builtins."
"arithmetic/bignum modulo (divisor a nonzero multiple of 2^64)": "WASM cannot represent integers larger than 64 bits (see https://github.com/open-policy-agent/opa/issues/3711); this change fixes the Go topdown builtin."
"aggregates/sum integer fast-path overflow (elements fit int64, sum does not)": "WASM cannot represent integers larger than 64 bits (see https://github.com/open-policy-agent/opa/issues/3711); this change fixes the Go topdown builtin."
"jsonbuiltins/unmarshal number beyond the supported exponent is undefined": "WASM parses JSON natively and does not apply the exponent limit of the Go topdown json.unmarshal."
"jsonbuiltins/unmarshal number with too big an exponent is undefined": "WASM parses JSON natively and does not apply the exponent limit of the Go topdown json.unmarshal."
"strings/indexof: empty search string is an error": "WASM indexof returns 0 for an empty search string; the Go topdown builtin raises an error."
"strings/indexof: empty search string in the empty string is an error": "WASM indexof returns 0 for an empty search string; the Go topdown builtin raises an error."
"base64builtins/base64 is_valid unpadded input of invalid length": "WASM base64.is_valid accepts the unpadded input \"abc\"; the Go topdown builtin rejects it."
"arithmetic/ceil, floor and round of 1e20": "WASM renders 1e20 as \"1e+20\" instead of the full integer (see https://github.com/open-policy-agent/opa/issues/3711)."
"jsonbuiltins/json.unmarshal replaces a lone surrogate in a value": "WASM json.unmarshal rejects a lone surrogate escape (illegal string escape character); the Go topdown builtin replaces it with U+FFFD."
"jsonbuiltins/json.unmarshal replaces a lone surrogate in an object key": "WASM json.unmarshal rejects a lone surrogate escape (illegal string escape character); the Go topdown builtin replaces it with U+FFFD."
"jsonbuiltins/a lone surrogate in a string counts as one code point": "WASM json.unmarshal rejects a lone surrogate escape (illegal string escape character); the Go topdown builtin replaces it with U+FFFD."
