name: Benchmarks

on:
  workflow_dispatch: {}
  push:
    branches: [main]

# NOTE(sr): No concurrency group here on purpose: GitHub only ever queues one
# waiting run per group, so a shared group dropped regression comments whenever
# two pushes landed close together.

permissions:
  contents: read

jobs:
  # Check what types of changes this push contains
  check-changes:
    name: Check what files changed
    runs-on: ubuntu-24.04
    outputs:
      bench: ${{ steps.changes.outputs.bench }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # full history, but only fetch the blobs we read
          persist-credentials: false

      - name: Download OPA
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: edge

      - name: Check for file changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          echo "Comparing $BEFORE_SHA with $CURRENT_SHA"
          # There is no pull request here, so the input has no "pr" key. The
          # policies that need it do nothing in that case.
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" \
            | jq -R '{filename: .}' \
            | jq -s --arg event "$EVENT_NAME" '{event: $event, files: .}' > checks_input.json

          if jq -e '.files | length == 0' checks_input.json >/dev/null; then
            echo "Warning: No changed files found"
            exit 0
          fi

          echo "Changed files:"
          jq -r '.files[].filename' checks_input.json

          opa eval \
          --data build/policy/pr-check/pr_check.rego \
          --input checks_input.json \
          --format pretty \
          'data.policy["pr-check"]' > opa_result.json

          bench_result=$(jq -c '.changes.bench // []' opa_result.json)

          echo "bench=${bench_result}" >> $GITHUB_OUTPUT

          echo "Final outputs:"
          echo "  bench=${bench_result}"

  regression-check:
    permissions:
      contents: read
      pull-requests: write
    name: Check for regressions
    runs-on: ubuntu-24.04
    needs: [check-changes]
    if: ${{ needs.check-changes.outputs.bench != '' && needs.check-changes.outputs.bench != '[]' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch base commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git fetch --depth=1 origin "$BEFORE_SHA"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
      - name: Install tools
        run: cd build/tools && go install tool
      - name: Run benchmarks and comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BENCH_PKGS: ${{ needs.check-changes.outputs.bench }}
        run: go run ./build/bench-comment
