version: 2
updates:
  - package-ecosystem: gomod
    directories:
    - /
    - /e2e
    - /build/tools
    schedule:
      interval: monthly
    labels: []
    groups:
      go.opentelemetry.io:
        patterns:
          - "go.opentelemetry.io/*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "go.opentelemetry.io/*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    labels: []
    groups:
      website:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    # Remove when @docusaurus/theme-mermaid widens its peer range to accept
    # @mermaid-js/layout-elk >=0.2.0.
    ignore:
      - dependency-name: "@mermaid-js/layout-elk"
        versions: [">=0.2.0"]
  - package-ecosystem: npm
    directory: /e2e/api/compile/prisma
    schedule:
      interval: monthly
    labels: []
    groups:
      e2e/prisma:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    groups:
      gha-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
