  - note: templatestrings/inside some
    modules:
      - |
        package test

        users := {"alice_1", "alice_2"}
        id := 1

        t if {
        	$"user_{id}" in users
        }
    want:
      - module: |
          package test

          users := {"alice_1", "alice_2"} if {
          	true
          }

          id := 1 if {
          	true
          }

          t = true if {
          	__local1__ = data.test.id
          	internal.template_string(["user_", {__local1__}], __local0__)
          	__local2__ = data.test.users
          	internal.member_2(__local0__, __local2__)
          }
  - note: templatestrings/inside some, domain
    modules:
      - |
        package test

        t if {
        	some "user_1" in [$"alice_{1}", $"alice_{2}"]
        }
    want:
      - module: |
          package test

          t = true if {
          	internal.template_string(["alice_", 1], __local2__)
          	internal.template_string(["alice_", 2], __local3__)
          	__local4__ = [__local2__, __local3__]
          	"user_1" = __local4__[__local1__]
          }
  - note: 'templatestrings/template string in head referencing var from some with template string in domain (issue #8162)'
    modules:
      - |
        package test

        r contains $"{val}" if {
        	some val in [1, $"{1 + 1}"]
        }
    want:
      - module: |
          package test

          r contains __local4__ if {
          	__local8__ = {__local3__ | plus(1, 1, __local5__); __local3__ = __local5__}
          	internal.template_string([__local8__], __local6__)
          	__local7__ = [1, __local6__]
          	__local2__ = __local7__[__local1__]
          	internal.template_string([{__local2__}], __local4__)
          }
  - note: templatestrings/in else body
    modules:
      - |
        package test

        p if {
        	false
        } else := msg if {
        	msg := $"foo: {input.y}"
        }
    want:
      # ast rather than module: the compiled rule `p = true if { false } else =
      # __local0__ if { __local3__ = {__local1__ | __local1__ = input.y};
      # internal.template_string(["foo: ", __local3__], __local2__); __local0__ =
      # __local2__ }` prints as Rego that parses to a different AST.
      - ast: |
          {
            "package": {
