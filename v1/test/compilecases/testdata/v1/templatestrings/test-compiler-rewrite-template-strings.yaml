---
# Generated externalized tests from TestCompilerRewriteTemplateStrings
cases:
  - note: templatestrings/empty template string, head value
    modules:
      - |
        package test

        p := $""
    want:
      - module: |
          package test

          p := __local0__ if {
          	internal.template_string([""], __local0__)
          }
  - note: templatestrings/empty template string, head set value
    modules:
      - |
        package test

        p contains $""
    want:
      - module: |
          package test

          p contains __local0__ if {
          	internal.template_string([""], __local0__)
          }
  - note: templatestrings/empty template string, head map key
    modules:
      - |
        package test

        p[$""] := true
    want:
      - module: |
          package test

          p[__local0__] := true if {
          	internal.template_string([""], __local1__)
          	__local0__ = __local1__
          }
  - note: templatestrings/empty template string, in body
    modules:
      - |
        package test

        p := x if {
        	x := $""
        }
    want:
      - module: |
          package test

          p := __local0__ if {
          	internal.template_string([""], __local1__)
          	__local0__ = __local1__
          }
  - note: templatestrings/empty template string, in body, no output arg
    modules:
      - |
        package test

        p if {
        	$""
        }
    want:
      - module: |
          package test

          p = true if {
          	internal.template_string([""], __local0__)
          	__local0__
          }
