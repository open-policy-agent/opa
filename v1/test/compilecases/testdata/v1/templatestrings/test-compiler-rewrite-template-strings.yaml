  - note: templatestrings/inside every expression, body
    modules:
      - |
        package test

        p if {
        	every i, x in input.l1 {
        		x == $"<{input.l2[i]}>"
        	}
        }
    want:
      - module: |
          package test

          p = true if {
          	__local3__ = input.l1
          	every __local0__, __local1__ in __local3__ {
          		__local5__ = {__local2__ | __local2__ = input.l2[__local0__]}
          		internal.template_string(["<", __local5__, ">"], __local4__)
          		__local1__ = __local4__
          	}
