          right : number
    exhaustive: true
  - note: types/member-array-nested
    modules:
      - |
        package test

        p if {
        	[1, "a"] in [[1, 2]]
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : array<number, string>
          right : array<number, number>
    exhaustive: true
  - note: types/member-set
    modules:
      - |
        package test

        p if {
        	"a" in {1, 2}
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-object
    modules:
      - |
        package test

        p if {
        	"a" in {"x": 1}
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-call
    modules:
      - |
        package test

        p if {
        	"a" in numbers.range(1, 5)
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-result-captured
    modules:
      - |
        package test

        p if {
        	x = "a" in [1, 2]; x
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 6
        message: match error
        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-with-key-key
    modules:
      - |
        package test

        p if {
        	"a", 1 in [1, 2]
        }
