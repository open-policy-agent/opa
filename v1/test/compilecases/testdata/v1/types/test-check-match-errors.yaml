          right : null
    exhaustive: true
  - note: types/any
    modules:
      - |
        package test

        p if {
        	x = ["str", 1]; x[_] = null
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 18
        message: match error
        detail: |-
          left  : any<number, string>
          right : null
    exhaustive: true
  - note: types/member-array
    modules:
      - |
        package test

        p if {
