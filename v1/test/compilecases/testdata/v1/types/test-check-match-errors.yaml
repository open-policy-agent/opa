        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-with-key-value
    modules:
      - |
        package test

        p if {
        	0, "a" in [1, 2]
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : string
          right : number
    exhaustive: true
  - note: types/member-with-key-object-key
    modules:
      - |
        package test

        p if {
        	1, 1 in {"x": 1}
        }
    want_errors:
      - code: rego_type_error
        row: 4
        col: 2
        message: match error
        detail: |-
          left  : number
          right : string
    exhaustive: true
