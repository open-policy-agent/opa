---
# Generated externalized tests from TestCheckRefErrInvalid
cases:
  - note: types/bad non-leaf var
    modules:
      - |
        package test

        p if { true }
        q = {"foo": 1, "bar": 2} if { true }
        a.b.c[3] = x if { x = {"x": {"y": 2}} }
      - |
        package probe

        wrapped if {
        	x = 1; data.test[x]
        }
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 4
        col: 9
        message: 'undefined ref: data.test[x]'
        detail: |-
          data.test[x]
                    ^
                    have (type): number
                    want (one of): ["a" "p" "q"]
  - note: types/bad non-leaf ref
