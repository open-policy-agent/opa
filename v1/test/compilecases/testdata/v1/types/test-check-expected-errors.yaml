---
# Generated externalized tests from TestCheckExpectedErrors
cases:
  - note: types/value with multiple assignments
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package p

        default f := ""

        f := 1
        r := f()
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 6
        col: 6
        message: undefined function data.p.f
  - note: types/value with one assignments
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package p

        f := 1
        r := f()
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 4
        col: 6
        message: undefined function data.p.f
  - note: types/value with no assignments
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package p

        r := f()
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 3
        col: 6
        message: undefined function f
  - note: types/function used as reference
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package play

        import rego.v1

        f(x) := x

        allow if {
            some x in f
        }
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 8
        col: 15
        message: function data.play.f used as reference, not called
        detail: |-
          data.play.f[__local3__]
          ^^^^^^^^^^^
          have: (any) => any
  - note: types/function used as reference-2
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package play

        p if { [data.base.foo] }
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 3
        col: 9
        message: function data.base.foo used as reference, not called
        detail: |-
          data.base.foo
          ^^^^^^^^^^^^^
          have: (array<string, string>) => array[string]
  - note: types/wrong type used directly
    modules:
      - |
        package base

        foo([a, b]) = y if { split(a, b, y) }
      - |
        package p

        s := sum([1, "foo"])
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 3
        col: 6
        message: 'sum: invalid argument(s)'
        detail: |-
          have: (array<number, string>, ???)
          want: (collection: any<array[number], set[number]>, n: number)
  - note: types/wrong type as reference
    modules:
