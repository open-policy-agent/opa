        nums[x] contains x if some x in [1, 2, 3]

        bug if {
            nums[x]
            x == 1
        }
    want:
      - module: |
          package base

          foo([__local0__, __local1__]) = y if {
          	split(__local0__, __local1__, y)
          }
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [rego.v1]
        module: |
          package p

          nums[__local4__] contains __local4__ if {
          	__local5__ = [1, 2, 3]
          	__local4__ = __local5__[__local3__]
          }

          bug = true if {
          	data.p.nums[x]
          	x = 1
          }
