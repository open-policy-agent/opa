---
# Generated externalized tests from TestCompilerCheckKeywordOverrides
cases:
  - note: keywords/global assignments (strict)
    modules:
      - |
        package test

        input = 1
        p := 2
        data := 3
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: rules must not shadow input (use a different rule name)
      - code: rego_compile_error
        row: 5
        col: 1
        message: rules must not shadow data (use a different rule name)
    exhaustive: true
  - note: keywords/array comprehension-local assignments (strict)
    modules:
      - |
        package test

        p = [ x |
        	input := 1
        	x := 2
        	data := 3
        ]
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 2
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 6
        col: 2
        message: variables must not shadow data (use a different variable name)
    exhaustive: true
  - note: keywords/set comprehension-local assignments (strict)
    modules:
      - |
        package test

        p = { x |
        	input := 1
        	x := 2
        	data := 3
        }
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 2
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 6
        col: 2
        message: variables must not shadow data (use a different variable name)
    exhaustive: true
  - note: keywords/object comprehension-local assignments (strict)
    modules:
      - |
        package test

        p = { x: 1 |
        	input := 1
        	x := 2
        	data := 3
        }
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 2
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 6
        col: 2
        message: variables must not shadow data (use a different variable name)
    exhaustive: true
