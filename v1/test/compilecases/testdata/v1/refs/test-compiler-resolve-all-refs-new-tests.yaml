# Generated externalized tests from TestCompilerResolveAllRefsNewTests
cases:
  - note: refs/ref-rules referenced in body
    modules:
      - |
        package test

        a.b.c = 1
        q if a.b.c == 1
    want:
      - module: |
          package test

          a.b.c = 1 if {
          	true
          }

          q = true if {
          	data.test.a.b.c = 1
          }
  - note: refs/ref-rules from other module referenced in body
    modules:
      - |
        package test

        q if a.b.c == 1
      - |
        package test

        a.b.c = 1
    want:
      - module: |
          package test

          q = true if {
          	data.test.a.b.c = 1
          }
      - module: |
          package test

          a.b.c = 1 if {
          	true
          }
