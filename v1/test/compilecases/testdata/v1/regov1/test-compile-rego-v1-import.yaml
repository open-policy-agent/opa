  - note: regov1/duplicate-imports-multiple-modules
    modules:
      - |
        package test

        import rego.v1
        import data.foo
        import data.bar.foo
        p if {
        	foo == "bar"
        }
      - |
        package test

        import rego.v1
        import data.foo
        import data.bar.foo
        q if {
        	foo == "bar"
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.foo
      - module: test-1.rego
        code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.foo
    exhaustive: true
  - note: regov1/var-shadows-input
    modules:
      - |
        package test

        import rego.v1
        p if {
        	input := 1
        	input == 1
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: variables must not shadow input (use a different variable name)
    exhaustive: true
  - note: regov1/var-shadows-input-multiple-modules
    modules:
      - |
        package test

        import rego.v1
        p if {
        	input := 1
        	input == 1
        }
      - |
        package test

        import rego.v1
        q if {
        	input := 1
        	input == 1
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: variables must not shadow input (use a different variable name)
      - module: test-1.rego
        code: rego_compile_error
        row: 5
        col: 2
        message: variables must not shadow input (use a different variable name)
    exhaustive: true
