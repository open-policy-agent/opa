  - note: regov1/deprecated-built-in
    modules:
      - |
        package test

        import rego.v1
        p := all([true, false])
    want_errors:
      - code: rego_type_error
        row: 4
        col: 6
        message: 'deprecated built-in function calls in expression: all'
    exhaustive: true
  - note: regov1/deprecated-built-in-multiple
    modules:
      - |
        package test

        import rego.v1
        p := all([true, false])
        q := any([true, false])
    want_errors:
      - code: rego_type_error
        row: 4
        col: 6
        message: 'deprecated built-in function calls in expression: all'
      - code: rego_type_error
        row: 5
        col: 6
        message: 'deprecated built-in function calls in expression: any'
    exhaustive: true
  - note: regov1/deprecated-built-in-multiple-modules
    modules:
      - |
