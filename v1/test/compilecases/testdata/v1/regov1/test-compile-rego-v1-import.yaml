---
# Generated externalized tests from TestCompileRegoV1Import
cases:
  - note: regov1/duplicate-imports
    modules:
      - |
        package test

        import rego.v1
        import data.foo
        import data.bar.foo
        p if {
        	foo == "bar"
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.foo
    exhaustive: true
  - note: regov1/duplicate-imports-alias
    modules:
      - |
        package test

        import rego.v1
        import data.foo
        import data.bar as foo
        p if {
        	foo == "bar"
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.foo
    exhaustive: true
  - note: regov1/duplicate-imports-alias-different-order
    modules:
      - |
        package test

        import rego.v1
        import data.bar as foo
        import data.foo
        p if {
        	foo == "bar"
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.bar as foo
    exhaustive: true
  - note: regov1/duplicate-imports-repeat
    modules:
      - |
        package test

        import rego.v1
        import data.foo
        import data.foo
        p if {
        	foo == "bar"
        }
    want_errors:
