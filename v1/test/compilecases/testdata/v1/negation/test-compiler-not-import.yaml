---
# Generated externalized tests from TestCompilerNotImport
cases:
  - note: negation/no import
    modules:
      - |
        package negation

        p if {
        	not input.x + input.y == input.z
        }
    want:
      - module: |
          package negation

          p = true if {
          	__local1__ = input.x
          	__local2__ = input.y
          	plus(__local1__, __local2__, __local0__)
          	not __local0__ = input.z
          }
  - note: negation/negated call, equal
    modules:
      - |
        package negation

        import future.keywords.not
        p if {
        	not 1 + 2 == 3
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p = true if {
          	not {plus(1, 2, __local0__); __local0__ = 3}
          }
  - note: negation/negated call, unification
    modules:
      - |
        package negation

        import future.keywords.not
        p if {
        	not 1 + 2 = 3
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p = true if {
          	not {plus(1, 2, __local0__); __local0__ = 3}
          }
  - note: negation/negated call, unification, explicit not-body
    modules:
      - |
        package negation

        import future.keywords.not
        p if {
        	not { 1 + 2 = 3 }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p = true if {
          	not {plus(1, 2, __local0__); __local0__ = 3}
          }
  - note: negation/negated call with refs (local var expansion)
    modules:
      - |
        package negation

        import future.keywords.not
        p if {
        	not input.x + input.y == input.z
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p = true if {
          	not {__local1__ = input.x; __local2__ = input.y; plus(__local1__, __local2__, __local0__); __local0__ = input.z}
          }
  - note: negation/negated call with vars, inside comprehension
    modules:
      - |
        package negation

        import future.keywords.not

        p := [x | x := "foo"; not f(input.x)]

        f(_) := true
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p := __local2__ if {
          	__local2__ = [__local0__ | __local0__ = "foo"; not {__local3__ = input.x; data.negation.f(__local3__)}]
          }

          f(__local1__) := true if {
          	true
          }
  - note: negation/negated call with vars, inside comprehension, assignment in implicit not body
    modules:
      - |
        package negation

        import future.keywords.not

        p := [x | not x := "foo" ]

        f(_) := true
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 11
        message: cannot assign vars inside negated expression
    exhaustive: true
  - note: negation/negated call with vars, inside every
    modules:
      - |
        package negation

        import future.keywords.not

        p if {
        	every x in input.x {
        		not f(x, input.y)
        	}
        }

        f(_, _) := true
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package negation

          p = true if {
          	__local4__ = input.x
          	every __local0__, __local1__ in __local4__ {
          		not {__local5__ = input.y; data.negation.f(__local1__, __local5__)}
          	}
          }

          f(__local2__, __local3__) := true if {
          	true
          }
