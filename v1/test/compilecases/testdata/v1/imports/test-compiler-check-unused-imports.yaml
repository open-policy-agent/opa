---
# Generated externalized tests from TestCompilerCheckUnusedImports
cases:
  - note: imports/ignore-unused-rego-import
    modules:
      - |
        package p

        import rego.v1
        r if { 10 == 10 }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [rego.v1]
        module: |
          package p

          r = true if {
          	10 = 10
          }
  - note: imports/import-used-as-function-operand
    modules:
      - |
        package p

        import data.foo
        r = count(foo) > 1 # only one operand
    want:
      - module: |
          package p

          r = __local1__ if {
          	__local2__ = data.foo
          	count(__local2__, __local0__)
          	gt(__local0__, 1, __local1__)
          }
  - note: imports/import-used-as-function-operand-compount-term
    modules:
      - |
        package p

        import data.foo
        r = sprintf("%v %d", [foo, 0])
    want:
      - module: |
          package p

          r = __local0__ if {
          	__local1__ = data.foo
          	sprintf("%v %d", [__local1__, 0], __local0__)
          }
