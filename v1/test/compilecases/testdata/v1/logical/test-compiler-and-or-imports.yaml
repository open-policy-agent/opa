---
# Generated externalized tests from TestCompilerAndOrImports
cases:
  - note: logical/and, or, simple
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        p if {
        	x := 1
        	y := 2
        	z := 3
        	x and y or z
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.and, future.keywords.or]
        module: |
          package logic

          p = true if {
          	__local0__ = 1
          	__local1__ = 2
          	__local2__ = 3
          	__local0__ and __local1__ or __local2__
          }
  - note: logical/and, assignment, forbidden in implicit body
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        p if {
        	x := 1 and y := 2
        }
    want_errors:
      - code: rego_compile_error
        row: 7
        col: 2
        message: cannot assign vars inside implicit and operand
      - code: rego_compile_error
        row: 7
        col: 13
        message: cannot assign vars inside implicit and operand
    exhaustive: true
  - note: logical/or, assignment, forbidden in implicit body
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        p if {
        	x := 1 or y := 2
        }
    want_errors:
      - code: rego_compile_error
        row: 7
        col: 2
        message: cannot assign vars inside implicit or operand
      - code: rego_compile_error
        row: 7
        col: 12
        message: cannot assign vars inside implicit or operand
    exhaustive: true
  - note: logical/and, assignment in implicit body, var referenced in outer scope
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        p if {
        	input.a and x := input.b
        	x == 1
        }
    want_errors:
      - code: rego_compile_error
        row: 7
        col: 14
        message: cannot assign vars inside implicit and operand
    exhaustive: true
