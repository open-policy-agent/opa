    want_errors:
      - code: rego_compile_error
        row: 9
        col: 18
        message: cannot assign vars inside negated expression
    exhaustive: true
  - note: logical/and, assignment in explicit not body, implicit operand
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        import future.keywords.not

        p if {
        	input.a and not { x := input.b; x == 1 }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.and, future.keywords.not, future.keywords.or]
        module: |
          package logic

          p = true if {
          	input.a and not {__local0__ = input.b; __local0__ = 1}
          }
  - note: logical/and, chained, assignment in explicit bodies
    modules:
      - |
        package logic

        import future.keywords.and
        import future.keywords.or

        p if {
        	{ x := 1; x > 0 } and true and { y := 2; y > 0 }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.and, future.keywords.or]
        module: |
          package logic

          p = true if {
          	{
          		__local0__ = 1
          		gt(__local0__, 0)
          	} and true and {
          		__local1__ = 2
          		gt(__local1__, 0)
