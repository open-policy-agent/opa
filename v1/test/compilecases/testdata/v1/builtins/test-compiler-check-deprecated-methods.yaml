---
# Generated externalized tests from TestCompilerCheckDeprecatedMethods
cases:
  - note: builtins/all-built-in-strict
    modules:
      - |
        package test

        p := all([true, false])
    want_errors:
      - code: rego_type_error
        row: 3
        col: 6
        message: 'deprecated built-in function calls in expression: all'
    exhaustive: true
  - note: builtins/user-defined-all
    modules:
      - |
        package test

        import future.keywords.in
        all(arr) = {x | some x in arr} == {true}
        p := all([true, false])
    want:
      # The compiler drops directive imports. A consumer has to put them in effect for parsing.
      - imports: [future.keywords.in]
        module: |
          package test

          all(__local0__) = __local4__ if {
          	__local6__ = {__local3__ | __local3__ = __local0__[__local2__]}
          	equal(__local6__, {true}, __local4__)
          }

          p := __local5__ if {
          	data.test.all([true, false], __local5__)
          }
  - note: builtins/any-built-in-strict
    modules:
      - |
        package test

        p := any([true, false])
    want_errors:
      - code: rego_type_error
        row: 3
        col: 6
        message: 'deprecated built-in function calls in expression: any'
    exhaustive: true
  - note: builtins/user-defined-any
    modules:
      - |
        package test

        import future.keywords.in
        any(arr) := true in arr
        p := any([true, false])
    want:
      # The compiler drops directive imports. A consumer has to put them in effect for parsing.
      - imports: [future.keywords.in]
        module: |
          package test

          any(__local0__) := __local1__ if {
          	internal.member_2(true, __local0__, __local1__)
          }

          p := __local2__ if {
          	data.test.any([true, false], __local2__)
          }
  - note: builtins/re-match-built-in-strict
    modules:
      - |
        package test

        p := re_match("[a]", "a")
    want_errors:
      - code: rego_type_error
        row: 3
        col: 6
        message: 'deprecated built-in function calls in expression: re_match'
    exhaustive: true
