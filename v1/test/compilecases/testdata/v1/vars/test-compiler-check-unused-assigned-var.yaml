        p if {
        	x := 2
        	y := [z | z := 2 * x]
        }
    want:
      - module: |
          package test

          p = true if {
          	__local0__ = 2
          	__local2__ = [__local1__ | mul(2, __local0__, __local3__); __local1__ = __local3__]
          }
  - note: vars/rule with nested array comprehension and shadowing (strict)
