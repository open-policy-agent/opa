---
# Generated externalized tests from TestCompilerCheckUnusedAssignedVar
cases:
  - note: vars/global var
    modules:
      - |
        package test

        x := 1
    want:
      - module: |
          package test

          x := 1 if {
          	true
          }
  - note: vars/simple rule with wildcard
    modules:
      - |
        package test

        p if {
        	_ := 1
        }
    want:
      - module: |
          package test

          p = true if {
          	__local0__ = 1
          }
  - note: vars/simple rule (strict)
    strict: enabled
    modules:
      - |
        package test

        p if {
        	x := 1
        	y := 2
        	z := x + 3
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: assigned var y unused
      - code: rego_compile_error
        row: 6
        col: 2
        message: assigned var z unused
    exhaustive: true
  - note: vars/simple rule (non-strict)
    strict: disabled
    modules:
      - |
        package test

        p if {
        	x := 1
        	y := 2
        	z := x + 3
        }
    want:
      - module: |
          package test

          p = true if {
          	__local0__ = 1
          	__local1__ = 2
          	plus(__local0__, 3, __local3__)
          	__local2__ = __local3__
          }
  - note: vars/rule with return (strict)
    strict: enabled
    modules:
      - |
        package test

        p = x if {
        	x := 2
        	y := 3
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: assigned var y unused
    exhaustive: true
  - note: vars/rule with return (non-strict)
    strict: disabled
    modules:
      - |
        package test

        p = x if {
        	x := 2
        	y := 3
        }
    want:
      - module: |
          package test

          p = __local0__ if {
          	__local0__ = 2
          	__local1__ = 3
          }
  - note: vars/rule with function call (strict)
    strict: enabled
    modules:
      - |
        package test

        p if {
        	x := 2
        	y := f(x)
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: assigned var y unused
    exhaustive: true
  - note: vars/rule with function call (non-strict)
    strict: disabled
    modules:
      - |
        package test

        p if {
        	x := 2
        	y := f(x)
        }
    want_errors:
      - code: rego_type_error
        row: 5
        col: 7
        message: undefined function f
  - note: vars/rule with nested array comprehension (strict)
    strict: enabled
    modules:
      - |
        package test

        p if {
        	x := 2
        	y := [z | z := 2 * x]
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 2
        message: assigned var y unused
    exhaustive: true
  - note: vars/rule with nested array comprehension (non-strict)
    strict: disabled
