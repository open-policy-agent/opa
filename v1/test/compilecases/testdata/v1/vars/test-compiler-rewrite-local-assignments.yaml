        package test

        body if { a := 1; a > 0 }
    want:
      - module: |
          package test

          body = true if {
          	__local0__ = 1
          	gt(__local0__, 0)
          }
  - note: vars/local assignments 1
    modules:
      - |
        package test

        head_vars(a) = b if { b := a }
    want:
      - module: |
          package test

          head_vars(__local0__) = __local1__ if {
          	__local1__ = __local0__
          }
  - note: vars/local assignments 2
