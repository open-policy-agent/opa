      # __local2__ if { __local2__ = __local0__[__local1__] } else = __local3__ if
      # { __local3__ = __local1__ } else = [__local4__] if { __local5__ =
      # __local1__[0]; __local4__ = __local0__[__local5__] }` prints as Rego that
      # parses to a different AST.
