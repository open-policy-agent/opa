                      {
                        "type": "var",
                        "value": "__local2__"
                      },
                      {
                        "type": "ref",
                        "value": [
                          {
                            "type": "var",
                            "value": "__local0__"
                          },
                          {
                            "type": "var",
                            "value": "__local1__"
                          }
                        ]
                      }
                    ]
                  }
                ],
                "else": {
