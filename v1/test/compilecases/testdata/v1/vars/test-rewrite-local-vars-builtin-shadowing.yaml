          {
            "package": {
              "path": [
                {
                  "type": "var",
                  "value": "data"
                },
                {
                  "type": "string",
                  "value": "test"
                }
              ]
            },
            "rules": [
              {
                "body": [
                  {
                    "index": 0,
                    "terms": [
