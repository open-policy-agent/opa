  - note: vars/built-in call operator is preserved
    modules:
      - |
        package test

        p := n if { xs := [1, 2, 3]; n := count(xs) }
    want:
      - module: |
          package test

          p := __local1__ if {
          	__local0__ = [1, 2, 3]
          	count(__local0__, __local2__)
          	__local1__ = __local2__
          }
    want_stages:
      RewriteLocalVars:
        - module: |
            package test

            p := __local1__ if {
            	__local0__ = [1, 2, 3]
            	__local1__ = count(__local0__)
            }
  - note: vars/built-in name as function mock is preserved
    modules:
