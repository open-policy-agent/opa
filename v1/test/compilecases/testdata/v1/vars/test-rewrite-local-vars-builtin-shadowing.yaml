                      "index": 0,
                      "terms": [
                        {
                          "type": "ref",
                          "value": [
                            {
                              "type": "var",
                              "value": "eq"
                            }
                          ]
                        },
                        {
                          "type": "var",
                          "value": "__local3__"
                        },
                        {
                          "type": "var",
                          "value": "__local1__"
                        }
                      ]
                    }
                  ],
                  "else": {
                    "body": [
                      {
                        "generated": true,
