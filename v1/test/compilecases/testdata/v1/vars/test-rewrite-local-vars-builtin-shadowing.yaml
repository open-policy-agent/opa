---
# Generated externalized tests from TestRewriteLocalVarsBuiltinShadowing
cases:
  - note: vars/unify in body shadows built-in
    modules:
      - |
        package test

        p := count if { count = 5 }
    want:
      - module: |
          package test

          p := __local0__ if {
          	__local0__ = 5
          }
  - note: vars/shadowing var used as ref head
    modules:
      - |
        package test

        p := v if { count = [1, 2, 3]; v := count[0] }
    want:
      - module: |
          package test

          p := __local1__ if {
          	__local0__ = [1, 2, 3]
          	__local1__ = __local0__[0]
          }
  - note: 'vars/shadow in function else-branch (issue #3729)'
    modules:
      - |
        package test

        f(x, y, 1) := v if {
        	v := x[y]
        } else := count if {
        	count = y
        } else := [v] if {
        	v := x[y[0]]
        }
