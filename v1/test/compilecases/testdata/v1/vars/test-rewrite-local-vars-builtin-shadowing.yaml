      # data.test.orig(["a", "b"], __local3__) with data.test.orig as count;
      # __local1__ = __local3__ with data.test.orig as count }` prints as Rego
      # that parses to a different AST.
      - ast: |
          {
            "package": {
              "path": [
                {
                  "type": "var",
                  "value": "data"
                },
                {
                  "type": "string",
                  "value": "test"
                }
              ]
            },
            "rules": [
              {
                "body": [
