  - note: 'dynamicterms/arr if { [str] }'
    modules:
      - |
        package test

        str = "hello"

        arr if { [str] }
    want:
      - module: |
          package test

          str = "hello" if {
          	true
          }

          arr = true if {
          	__local0__ = data.test.str
          	[__local0__]
          }
