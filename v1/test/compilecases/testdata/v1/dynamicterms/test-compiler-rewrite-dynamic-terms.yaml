  - note: 'dynamicterms/ref if { str[str] }'
    # The rego_type_error belongs to the shared fixture, not to what this case tests:
    # `str` is a string, so indexing it is rejected well after the term rewrite the
    # case is about. want_stages carries the form the Go test asserts. Completing the
    # fixture would move the assertion into want.
    modules:
      - |
        package test

        str = "hello"

        ref if { str[str] }
    want_errors:
      - code: rego_type_error
        row: 5
        col: 14
        message: 'undefined ref: data.test.str[data.test.str]'
    want_stages:
      RewriteDynamicTerms:
        - module: |
            package test

            str = "hello" if {
            	true
            }

            ref = true if {
            	__local0__ = data.test.str
            	data.test.str[__local0__]
            }
  - note: 'dynamicterms/ref2 if { str[str[str]] }'
    # The rego_type_error belongs to the shared fixture, not to what this case tests:
    # `str` is a string, so indexing it is rejected well after the term rewrite the
    # case is about. want_stages carries the form the Go test asserts. Completing the
    # fixture would move the assertion into want.
    modules:
      - |
        package test

        str = "hello"

        ref2 if { str[str[str]] }
    want_errors:
      - code: rego_type_error
        row: 5
        col: 19
        message: 'undefined ref: data.test.str[data.test.str[data.test.str]]'
      - code: rego_type_error
        row: 5
        col: 19
        message: 'undefined ref: data.test.str[data.test.str]'
    want_stages:
      RewriteDynamicTerms:
        - module: |
            package test

            str = "hello" if {
            	true
            }

            ref2 = true if {
            	__local0__ = data.test.str
            	__local1__ = data.test.str[__local0__]
            	data.test.str[__local1__]
            }
