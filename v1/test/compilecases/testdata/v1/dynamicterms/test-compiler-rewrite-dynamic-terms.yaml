  - note: 'dynamicterms/eq_with if { [str] = [1] with input as 1 }'
    # The rego_type_error is the fixture's: the case compares an array of strings
    # with an array of numbers, which the type checker rejects long after the term
    # rewrite the case is about. want_stages carries the form the Go test asserts.
    # Completing the fixture would move the assertion into want.
    modules:
      - |
        package test

        str = "hello"

        eq_with if { [str] = [1] with input as 1 }
    want_errors:
      - code: rego_type_error
        row: 5
        col: 14
        message: match error
    want_stages:
      RewriteDynamicTerms:
        - module: |
            package test

            str = "hello" if {
            	true
            }

            eq_with = true if {
            	__local0__ = data.test.str with input as 1
            	[__local0__] = [1] with input as 1
            }
