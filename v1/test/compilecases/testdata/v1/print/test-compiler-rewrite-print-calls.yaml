---
# Generated externalized tests from TestCompilerRewritePrintCalls
cases:
  - note: print/print one
    print_statements: true
    modules:
      - |
        package test

        p if { print(1) }
    want:
      - module: |
          package test

          p = true if {
          	__local1__ = {__local0__ | __local0__ = 1}
          	internal.print([__local1__])
          }
  - note: print/print multiple
    print_statements: true
    modules:
      - |
        package test

        p if { print(1, 2) }
    want:
      - module: |
          package test

          p = true if {
          	__local2__ = {__local0__ | __local0__ = 1}
          	__local3__ = {__local1__ | __local1__ = 2}
          	internal.print([__local2__, __local3__])
          }
  - note: print/print inside set comprehension
    print_statements: true
    modules:
      - |
        package test

        p if { x = 1; {2 | print(x)} }
    want:
      - module: |
          package test

          p = true if {
          	x = 1
          	{2 | __local1__ = {__local0__ | __local0__ = x}; internal.print([__local1__])}
          }
  - note: print/print inside array comprehension
    print_statements: true
    modules:
      - |
        package test

        p if { x = 1; [2 | print(x)] }
    want:
      - module: |
          package test

          p = true if {
          	x = 1
          	[2 | __local1__ = {__local0__ | __local0__ = x}; internal.print([__local1__])]
          }
  - note: print/print inside object comprehension
    print_statements: true
    modules:
      - |
        package test

        p if { x = 1; {"x": 2 | print(x)} }
    want:
      - module: |
          package test

          p = true if {
          	x = 1
          	{"x": 2 | __local1__ = {__local0__ | __local0__ = x}; internal.print([__local1__])}
          }
  - note: print/print inside every
    print_statements: true
    modules:
      - |
        package test

        p if { every x in [1,2] { print(x) } }
    want:
      - module: |
          package test

          p = true if {
          	__local3__ = [1, 2]
          	every __local0__, __local1__ in __local3__ { __local4__ = {__local2__ | __local2__ = __local1__}; internal.print([__local4__]) }
          }
  - note: print/print output of nested call
    print_statements: true
    modules:
      - |
        package test

        p if {
        	x := split("abc", "")[y]
        	print(x, y)
        }
    want:
      - module: |
          package test

          p = true if {
          	split("abc", "", __local3__)
          	__local0__ = __local3__[y]
          	__local4__ = {__local1__ | __local1__ = __local0__}
          	__local5__ = {__local2__ | __local2__ = y}
          	internal.print([__local4__, __local5__])
          }
  - note: print/print call in head
    print_statements: true
    modules:
      - |
        package test

        p = {1 | print("x") }
    want:
      - module: |
          package test

          p = __local1__ if {
          	__local1__ = {1 | __local2__ = {__local0__ | __local0__ = "x"}; internal.print([__local2__])}
          }
  - note: print/print call in head - args treated as safe
    print_statements: true
    modules:
      - |
        package test

        f(a) = {1 | a[x]; print(x)}
    want:
      - module: |
          package test

          f(__local0__) = __local2__ if {
          	__local2__ = {1 | __local0__[x]; __local3__ = {__local1__ | __local1__ = x}; internal.print([__local3__])}
          }
  - note: print/print call of var in head key
    print_statements: true
    modules:
      - |
        package test

        f(_) = [1, 2, 3]
        p contains x if { [_, x, _] := f(true); print(x) }
    want:
      - module: |
          package test

          f(__local0__) = [1, 2, 3] if {
          	true
          }

          p contains __local2__ if {
          	data.test.f(true, __local5__)
          	[__local1__, __local2__, __local3__] = __local5__
          	__local6__ = {__local4__ | __local4__ = __local2__}
          	internal.print([__local6__])
          }
  - note: print/print call of var in head value
    print_statements: true
    modules:
      - |
        package test

        f(_) = [1, 2, 3]
        p = x if { [_, x, _] := f(true); print(x) }
    want:
      - module: |
          package test

          f(__local0__) = [1, 2, 3] if {
          	true
          }

          p = __local2__ if {
          	data.test.f(true, __local5__)
          	[__local1__, __local2__, __local3__] = __local5__
          	__local6__ = {__local4__ | __local4__ = __local2__}
          	internal.print([__local6__])
          }
  - note: print/print call of vars in head key and value
    print_statements: true
    modules:
      - |
        package test

        f(_) = [1, 2, 3]
        p[x] = y if { [_, x, y] := f(true); print(x) }
    want:
      - module: |
          package test

          f(__local0__) = [1, 2, 3] if {
          	true
          }

          p[__local2__] = __local3__ if {
          	data.test.f(true, __local5__)
          	[__local1__, __local2__, __local3__] = __local5__
          	__local6__ = {__local4__ | __local4__ = __local2__}
          	internal.print([__local6__])
          }
  - note: print/print call of vars altered with 'with' and call
    print_statements: true
    modules:
      - |
        package test

        q = input
        p if {
        	x := q with input as json.unmarshal("{}")
        	print(x)
        }
    want:
      - module: |
          package test

          q = __local3__ if {
          	__local3__ = input
          }

          p = true if {
          	json.unmarshal("{}", __local2__)
          	__local0__ = data.test.q with input as __local2__
          	__local4__ = {__local1__ | __local1__ = __local0__}
          	internal.print([__local4__])
          }
