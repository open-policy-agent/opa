---
# Generated externalized tests from TestCompilerCheckUnusedImports
cases:
  - note: imports/simple-unused-input-ref-with-same-name-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo.bar as bar
        r {
        	input.bar == 11
        }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.foo.bar as bar unused
    exhaustive: true
  - note: imports/simple-unused-input-ref-with-same-name-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo.bar as bar
        r {
        	input.bar == 11
        }
    want:
      - module: |
          package p

          r = true {
          	input.bar = 11
          }
  - note: imports/unused-import-but-imported-ref-used-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo # unused
        r { data.foo == 10 }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.foo unused
    exhaustive: true
  - note: imports/unused-import-but-imported-ref-used-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo # unused
        r { data.foo == 10 }
    want:
      - module: |
          package p

          r = true {
          	data.foo = 10
          }
  - note: imports/one-of-two-unused-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo
        import data.x.power #unused
        r { foo == 10 }
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 1
        message: import data.x.power unused
    exhaustive: true
  - note: imports/one-of-two-unused-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo
        import data.x.power #unused
        r { foo == 10 }
    want:
      - module: |
          package p

          r = true {
          	data.foo = 10
          }
  - note: imports/multiple-unused-with-input-ref-of-same-name-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo
        import data.x.power
        r { input.foo == 10 }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.foo unused
      - code: rego_compile_error
        row: 4
        col: 1
        message: import data.x.power unused
    exhaustive: true
  - note: imports/multiple-unused-with-input-ref-of-same-name-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo
        import data.x.power
        r { input.foo == 10 }
    want:
      - module: |
          package p

          r = true {
          	input.foo = 10
          }
  - note: imports/import-used-in-comparison
    rego_version: v0
    modules:
      - |
        package p

        import data.foo.x
        r { x == 10 }
    want:
      - module: |
          package p

          r = true {
          	data.foo.x = 10
          }
  - note: imports/multiple-used-imports-in-one-rule
    rego_version: v0
    modules:
      - |
        package p

        import data.foo.x
        import data.power.ranger
        r { ranger == x }
    want:
      - module: |
          package p

          r = true {
          	data.power.ranger = data.foo.x
          }
  - note: imports/multiple-used-imports-in-separate-rules
    rego_version: v0
    modules:
      - |
        package p

        import data.foo.x
        import data.power.ranger
        r { ranger == 23 }
        t { x == 1 }
    want:
      - module: |
          package p

          r = true {
          	data.power.ranger = 23
          }

          t = true {
          	data.foo.x = 1
          }
  - note: imports/import-used-as-plain-term
    rego_version: v0
    modules:
      - |
        package p

        import data.foo
        r {
        	foo
        }
    want:
      - module: |
          package p

          r = true {
          	data.foo
          }
  - note: imports/import-used-in-every-domain
    rego_version: v0
    modules:
      - |
        package p

        import future.keywords.every
        import data.foo
        r {
        	every x in foo { x > 1 }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.every]
        module: |
          package p

          r = true {
          	__local2__ = data.foo
          	every __local0__, __local1__ in __local2__ { gt(__local1__, 1) }
          }
  - note: imports/import-used-in-every-body
    rego_version: v0
    modules:
      - |
        package p

        import future.keywords.every
        import data.foo
        r {
        	every x in [1,2,3] { x > foo }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.every]
        module: |
          package p

          r = true {
          	__local2__ = [1, 2, 3]
          	every __local0__, __local1__ in __local2__ { __local3__ = data.foo; gt(__local1__, __local3__) }
          }
  - note: imports/future-import-kept-even-if-unused
    rego_version: v0
    modules:
      - |
        package p

        import future.keywords

        r { true }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords]
        module: |
          package p

          r = true {
          	true
          }
  - note: imports/shadowed-var-name-in-function-arg-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo # unused

        r { f(1) }
        f(foo) = foo == 1
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.foo unused
    exhaustive: true
  - note: imports/shadowed-var-name-in-function-arg-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo # unused

        r { f(1) }
        f(foo) = foo == 1
    want:
      - module: |
          package p

          r = true {
          	data.p.f(1)
          }

          f(__local0__) = __local1__ {
          	equal(__local0__, 1, __local1__)
          }
  - note: imports/shadowed-assigned-var-name-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.foo # unused

        r { foo := true; foo }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.foo unused
    exhaustive: true
  - note: imports/shadowed-assigned-var-name-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.foo # unused

        r { foo := true; foo }
    want:
      - module: |
          package p

          r = true {
          	__local0__ = true
          	__local0__
          }
  - note: imports/used-as-rule-value-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.bar # unused
        import data.foo

        r = foo { true }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.bar unused
    exhaustive: true
  - note: imports/used-as-rule-value-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.bar # unused
        import data.foo

        r = foo { true }
    want:
      - module: |
          package p

          r = __local0__ {
          	__local0__ = data.foo
          }
  - note: imports/unused-as-rule-value-but-same-data-ref-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package p

        import data.bar # unused
        import data.foo # unused

        r = data.foo { true }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: import data.bar unused
      - code: rego_compile_error
        row: 4
        col: 1
        message: import data.foo unused
    exhaustive: true
  - note: imports/unused-as-rule-value-but-same-data-ref-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package p

        import data.bar # unused
        import data.foo # unused

        r = data.foo { true }
    want:
      - module: |
          package p

          r = __local0__ {
          	__local0__ = data.foo
          }
