---
# Generated externalized tests from TestCompilerCheckDuplicateImports
cases:
  - note: imports/shadow (non-strict)
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import input.noconflict
        import input.foo
        import data.foo
        import data.bar.foo

        p := noconflict
        q := foo
    want:
      - module: |
          package test

          p := __local0__ {
          	__local0__ = input.noconflict
          }

          q := __local1__ {
          	__local1__ = data.bar.foo
          }
  - note: imports/alias shadow (non-strict)
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import input.noconflict
        import input.foo
        import input.bar as foo

        p := noconflict
        q := foo
    want:
      - module: |
          package test

          p := __local0__ {
          	__local0__ = input.noconflict
          }

          q := __local1__ {
          	__local1__ = input.bar
          }
