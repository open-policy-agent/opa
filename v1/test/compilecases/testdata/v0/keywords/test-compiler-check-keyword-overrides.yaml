  - note: keywords/global-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        input = 1
        p := 2
        data := 3
    compiles: true
  - note: keywords/rule-local-assignments-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        p {
        	input := 1
        	x := 2
        } else {
        	data := 3
        }
        q {
        	input := 4
        }
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 2
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 7
        col: 2
        message: variables must not shadow data (use a different variable name)
      - code: rego_compile_error
        row: 10
        col: 2
        message: variables must not shadow input (use a different variable name)
    exhaustive: true
