---
# Generated externalized tests from TestCompilerCheckKeywordOverrides
cases:
  - note: keywords/rule-names-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        input { true }
        p { true }
        data { true }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: rules must not shadow input (use a different rule name)
      - code: rego_compile_error
        row: 5
        col: 1
        message: rules must not shadow data (use a different rule name)
    exhaustive: true
  - note: keywords/rule-names-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        input { true }
        p { true }
        data { true }
    want:
      - module: |
          package test

          input = true {
          	true
          }

          p = true {
          	true
          }

          data = true {
          	true
          }
  - note: keywords/rule-names-set-construction-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        input.a { true }
        p { true }
        data.b { true }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: rules must not shadow input (use a different rule name)
      - code: rego_compile_error
