          	__local3__ = {__local1__ | __local0__ = 1; __local1__ = 2; __local2__ = 3}
          }
  - note: keywords/object-comprehension-local-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        p = { x: 1 |
        	input := 1
        	x := 2
        	data := 3
        }
    want:
      - module: |
          package test

          p = __local3__ {
          	__local3__ = {__local1__: 1 | __local0__ = 1; __local1__ = 2; __local2__ = 3}
          }
  - note: keywords/not-local-assignments-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        import future.keywords.not
        p {
        	not { input := 1; data := 2 }
        }
    want_errors:
      - code: rego_compile_error
        row: 5
        col: 8
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 5
        col: 20
        message: variables must not shadow data (use a different variable name)
    exhaustive: true
  - note: keywords/not-local-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import future.keywords.not
        p {
        	not { input := 1; data := 2 }
        }
    want:
      # The compiler drops directive imports; a consumer must put them in effect.
      - imports: [future.keywords.not]
        module: |
          package test

          p = true {
          	not {__local0__ = 1; __local1__ = 2}
          }
