          	true
          }

          data.b := 2 {
          	true
          }
  - note: keywords/leading-term-in-rule-refs-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        input.a.b { true }
        p { true }
        data.b.c := "foo" { true }
    want_errors:
      - code: rego_compile_error
        row: 3
        col: 1
        message: rules must not shadow input (use a different rule name)
      - code: rego_compile_error
