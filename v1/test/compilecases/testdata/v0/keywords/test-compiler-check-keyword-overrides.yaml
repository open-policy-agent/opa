  - note: keywords/leading-term-in-rule-refs-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        input.a.b { true }
        p { true }
        data.b.c := "foo" { true }
    want:
      - module: |
          package test

          input.a.b = true {
          	true
          }

          p = true {
          	true
          }

          data.b.c := "foo" {
          	true
          }
  - note: keywords/global-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        input = 1
        p := 2
        data := 3
    want:
      - module: |
          package test

          input = 1 {
          	true
          }

          p := 2 {
          	true
          }

          data := 3 {
          	true
          }
  - note: keywords/rule-local-assignments-strict
    rego_version: v0
    strict: enabled
    modules:
      - |
        package test

        p {
        	input := 1
        	x := 2
        } else {
        	data := 3
        }
        q {
        	input := 4
        }
    want_errors:
      - code: rego_compile_error
        row: 4
        col: 2
        message: variables must not shadow input (use a different variable name)
      - code: rego_compile_error
        row: 7
        col: 2
        message: variables must not shadow data (use a different variable name)
      - code: rego_compile_error
        row: 10
        col: 2
        message: variables must not shadow input (use a different variable name)
    exhaustive: true
  - note: keywords/rule-local-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        p {
        	input := 1
        	x := 2
        } else {
        	data := 3
        }
        q {
        	input := 4
        }
    want:
      - module: |
          package test

          p = true {
          	__local0__ = 1
          	__local1__ = 2
          } else = true {
          	__local2__ = 3
          }

          q = true {
          	__local3__ = 4
          }
  - note: keywords/array-comprehension-local-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        p = [ x |
        	input := 1
        	x := 2
        	data := 3
        ]
    want:
      - module: |
          package test

          p = __local3__ {
          	__local3__ = [__local1__ | __local0__ = 1; __local1__ = 2; __local2__ = 3]
          }
  - note: keywords/set-comprehension-local-assignments-non-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
