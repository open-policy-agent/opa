---
# Generated externalized tests from TestCompileRegoV1Import
cases:
  - note: regov1/duplicate-imports-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import future.keywords.if
        import data.foo
        import data.bar.foo
        p if {
        	foo == "bar"
        }
      - |
        package test

        import rego.v1
        import data.foo
        import data.bar.foo
        q if {
        	foo == "bar"
        }
    want_errors:
      - module: test-1.rego
        code: rego_compile_error
        row: 5
        col: 1
        message: import must not shadow import data.foo
    exhaustive: true
  - note: regov1/var-shadows-input-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import future.keywords.if
        p if {
        	input := 1
        	input == 1
        }
      - |
        package test

        import rego.v1
        q if {
        	input := 1
        	input == 1
        }
    want_errors:
      - module: test-1.rego
        code: rego_compile_error
        row: 5
        col: 2
        message: variables must not shadow input (use a different variable name)
    exhaustive: true
  - note: regov1/var-shadows-data-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        import future.keywords.if
        p if {
        	data := 1
        	data == 1
        }
      - |
        package test

        import rego.v1
        q if {
        	data := 1
        	data == 1
        }
    want_errors:
      - module: test-1.rego
        code: rego_compile_error
        row: 5
        col: 2
        message: variables must not shadow data (use a different variable name)
    exhaustive: true
  - note: regov1/rule-shadows-input-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        input := 1
      - |
        package test2

        import rego.v1
        input := 2
    want_errors:
      - module: test-1.rego
        code: rego_compile_error
        row: 4
        col: 1
        message: rules must not shadow input (use a different rule name)
    exhaustive: true
  - note: regov1/rule-shadows-data-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        data := 1
      - |
        package test2

        import rego.v1
        data := 2
    want_errors:
      - module: test-1.rego
        code: rego_compile_error
        row: 4
        col: 1
        message: rules must not shadow data (use a different rule name)
    exhaustive: true
  - note: regov1/deprecated-built-in-multiple-modules-not-all-strict
    rego_version: v0
    strict: disabled
    modules:
      - |
        package test

        p := all([true, false])
      - |
        package test

        import rego.v1
        q := all([true, false])
    want_errors:
      - module: test-1.rego
        code: rego_type_error
        row: 4
        col: 6
        message: 'deprecated built-in function calls in expression: all'
    exhaustive: true
