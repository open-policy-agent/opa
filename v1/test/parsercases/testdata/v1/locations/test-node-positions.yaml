---
cases:
  # These come from tests that parse a module and then check the row and col of
  # particular nodes by hand. `locations: true` states the same thing more
  # completely: it pins the position of every node, not the two or three a test
  # picked out. The construct each was written for is noted below.
  #
  # Most of OPA's other position tests assert Location.Text or Offset — byte spans
  # into the source — and stay in Go, since a side-table implementation would emit
  # identical errors and IR and still fail them.

  # From TestParseLogical_InnerExprHasLocation: the expressions inside an `and`
  # and an `or` operand carry their own positions, not the outer expression's.
  - note: locations/logical operands carry their own position
