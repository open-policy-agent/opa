---
cases:
  # Metadata comments, parsed with `annotations: true`. A fixture records the
  # parsed annotations, not the comments they came from: comments are dropped from
  # want_ast, and the module in the case shows the source anyway.
  - note: annotations/subject scope defaults to the rule
    annotations: true
    module: |
      package test

      # METADATA
      # title: allow requests from admins
      allow if {
      	input.role == "admin"
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "annotations": [
          {
            "scope": "rule",
            "title": "allow requests from admins"
          }
        ],
        "rules": [
          {
            "head": {
              "name": "allow",
              "ref": [
                {
                  "type": "var",
                  "value": "allow"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": [
                  {
                    "type": "ref",
                    "value": [
                      {
                        "type": "var",
                        "value": "equal"
                      }
                    ]
                  },
                  {
                    "type": "ref",
                    "value": [
                      {
                        "type": "var",
                        "value": "input"
                      },
                      {
                        "type": "string",
                        "value": "role"
                      }
                    ]
                  },
                  {
                    "type": "string",
                    "value": "admin"
                  }
                ]
              }
            ],
            "annotations": [
              {
                "scope": "rule",
                "title": "allow requests from admins"
              }
            ]
          }
        ]
      }
  - note: annotations/scope package
    annotations: true
    module: |
      # METADATA
      # scope: package
      # title: the example package
      package test

      p := 1
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "annotations": [
          {
            "scope": "package",
            "title": "the example package"
          }
        ],
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ]
          }
        ]
      }
  - note: annotations/scope document
    annotations: true
    module: |
      package test

      # METADATA
      # scope: document
      # title: every definition of p
      p if {
      	input.a
      }

      p if {
      	input.b
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "annotations": [
          {
            "scope": "document",
            "title": "every definition of p"
          }
        ],
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "ref",
                  "value": [
                    {
                      "type": "var",
                      "value": "input"
                    },
                    {
                      "type": "string",
                      "value": "a"
                    }
                  ]
                }
              }
            ],
            "annotations": [
              {
                "scope": "document",
                "title": "every definition of p"
              }
            ]
          },
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "ref",
                  "value": [
                    {
                      "type": "var",
                      "value": "input"
                    },
                    {
                      "type": "string",
                      "value": "b"
                    }
                  ]
                }
              }
            ],
            "annotations": [
              {
                "scope": "document",
                "title": "every definition of p"
              }
            ]
          }
        ]
      }
