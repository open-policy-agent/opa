                  {
                    "type": "ref",
                    "value": [
                      {
                        "type": "var",
                        "value": "input"
                      },
                      {
                        "type": "string",
                        "value": "name"
                      }
                    ]
                  },
                  {
                    "type": "string",
                    "value": "x"
                  }
