                  {
                    "type": "string",
                    "value": "request"
                  }
                ],
                "schema": [
                  {
                    "type": "var",
                    "value": "schema"
                  },
                  {
                    "type": "string",
                    "value": "request"
                  }
                ]
              }
            ],
            "custom": {
              "severity": "high",
              "tags": [
                "a",
                "b"
              ]
            },
            "scope": "rule",
            "title": "a fully annotated rule"
          }
        ],
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ],
            "annotations": [
              {
                "description": "A description spanning\nmore than one line.\n",
                "organizations": [
                  "Acme Corp"
                ],
                "related_resources": [
                  {
                    "ref": "https://example.com/docs"
                  },
                  {
                    "ref": "https://example.com/rfc",
                    "description": "the RFC it implements"
                  }
                ],
                "authors": [
                  {
                    "name": "Jane Doe",
                    "email": "jane@example.com"
                  },
                  {
                    "name": "anonymous"
                  }
                ],
                "schemas": [
                  {
                    "path": [
                      {
                        "type": "var",
                        "value": "input"
                      },
                      {
                        "type": "string",
                        "value": "request"
                      }
                    ],
                    "schema": [
                      {
                        "type": "var",
                        "value": "schema"
                      },
                      {
                        "type": "string",
                        "value": "request"
                      }
                    ]
                  }
                ],
                "custom": {
