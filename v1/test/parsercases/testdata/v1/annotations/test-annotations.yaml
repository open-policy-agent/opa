  - note: annotations/comments that are not metadata are not annotations
    annotations: true
    module: |
      package test

      # just a comment, not metadata
      p := 1
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ]
          }
        ]
      }
  # Without the option, a metadata comment is only a comment. The two cases parse
  # the same module and differ in nothing but `annotations`, so the fixtures show
  # what the option does.
  - note: annotations/not processed without the option
    module: |
      package test

      # METADATA
      # title: ignored here
      p := 1
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ]
          }
        ]
      }
  # Errors.
  # An unrecognised key is accepted and dropped rather than rejected: the
  # annotation below parses, carrying nothing but its default scope.
  - note: annotations/an unknown field is ignored
    annotations: true
    module: |
      package test

      # METADATA
      # nonsense: true
      p := 1
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "annotations": [
          {
            "scope": "rule"
          }
        ],
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ],
            "annotations": [
              {
                "scope": "rule"
              }
            ]
          }
        ]
      }
  - note: annotations/errors/invalid yaml
    annotations: true
    module: |
      package test

      # METADATA
      # title: [unterminated
      p := 1
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 1
        message: 'yaml: line 1: did not find expected '','' or '']'''
  - note: annotations/errors/unknown scope
    annotations: true
    module: |
      package test

      # METADATA
      # scope: nowhere
      p := 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: invalid annotation scope 'nowhere'. Use one of 'rule', 'document', 'package', or 'subpackages'
  - note: annotations/errors/entrypoint on a non-package non-rule scope
    annotations: true
    module: |
      # METADATA
      # scope: subpackages
      # entrypoint: true
      package test

      p := 1
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 1
        message: annotation entrypoint applied to non-document or package scope 'subpackages'
  - note: annotations/errors/attached to nothing
    annotations: true
    module: |
      package test

      p := 1

      # METADATA
      # title: nothing follows this
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: invalid annotation scope ''. Use one of 'rule', 'document', 'package', or 'subpackages'
