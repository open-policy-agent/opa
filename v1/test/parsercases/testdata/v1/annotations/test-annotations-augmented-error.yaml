---
# Generated externalized tests from TestAnnotationsAugmentedError
cases:
  - note: annotations/annotations-augmented-error/no whitespace after key/value separator
    module: |
      package opa.examples

      # METADATA
      # description:p is true
      p := true
    annotations: true
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 1
        message: |-
          yaml: unmarshal errors:
            line 1: cannot unmarshal !!str `descrip...` into ast.rawAnnotation
            Hint: on line 4, symbol(s) ['p'] immediately following a key/value separator ':' is not a legal yaml space character
