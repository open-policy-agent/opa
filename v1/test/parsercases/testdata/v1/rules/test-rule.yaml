      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "default": true,
            "head": {
              "name": "allow",
              "ref": [
                {
                  "type": "var",
                  "value": "allow"
                }
              ],
              "value": {
                "type": "boolean",
                "value": false
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ]
          }
        ]
      }
