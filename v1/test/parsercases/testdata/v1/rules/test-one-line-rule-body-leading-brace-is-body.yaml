  - note: rules/one-line-rule-body-leading-brace-is-body/multiple set elements can't be a body
    module: |
      package test

      p if {1, 2}
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 8
        message: 'unexpected , token: expected \n or ; or }'
