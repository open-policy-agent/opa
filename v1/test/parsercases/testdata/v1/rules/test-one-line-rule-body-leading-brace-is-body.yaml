---
# Generated externalized tests from TestOneLineRuleBodyLeadingBraceIsBody
cases:
  - note: rules/one-line-rule-body-leading-brace-is-body/single expression
    module: |
      package test

      p if { true }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ],
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            }
          }
        ]
      }
