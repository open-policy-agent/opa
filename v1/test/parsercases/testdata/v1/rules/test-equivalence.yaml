cases:
  - note: rules/membership-desugars-to-internal-member-2
    module: |
      package test

      p if {
      	1 in [1, 2]
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": [
                  {
                    "type": "ref",
                    "value": [
                      {
                        "type": "var",
                        "value": "internal"
                      },
                      {
                        "type": "string",
                        "value": "member_2"
                      }
                    ]
                  },
                  {
                    "type": "number",
                    "value": 1
                  },
                  {
                    "type": "array",
                    "value": [
                      {
                        "type": "number",
                        "value": 1
                      },
                      {
                        "type": "number",
                        "value": 2
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    want_equivalent: |
      package test

      p if {
      	internal.member_2(1, [1, 2])
      }
