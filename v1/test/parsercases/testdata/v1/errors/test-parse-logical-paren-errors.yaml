---
cases:
  - note: errors/parse-logical-paren-errors/empty group
    module: |
      package test

      import future.keywords.or

      p if {
      	a or ()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: empty parenthesized group
  - note: errors/parse-logical-paren-errors/parens cannot wrap a body with logical content
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and ({b or c})
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 8
        message: '`(...)` in an operand position cannot contain a body (hint: drop the parens to keep the body: `{b or c}`)'
  - note: errors/parse-logical-paren-errors/unterminated group
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and (b or c
      }
    want_errors:
      - code: rego_parse_error
        row: 8
        col: 1
        message: expected ) to close parenthesized group
  - note: errors/parse-logical-paren-errors/non-logical group operand backtracks to term path
    module: |
      package test

      import future.keywords.or

      p if {
      	a or (x = 1)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 10
        message: non-terminated expression
  - note: errors/parse-logical-paren-errors/empty group at statement start backtracks to term
    module: |
      package test

      p if {
      	() and a
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 3
        message: unexpected ) token
  - note: errors/parse-logical-paren-errors/group opening with an operator
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and ( or b)
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 10
        message: unexpected or keyword
  - note: errors/parse-logical-paren-errors/assignment in group backtracks to term path
    module: |
      package test

      import future.keywords.and

      p if {
      	a and (x := 1)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 11
        message: non-terminated expression
  - note: errors/parse-logical-paren-errors/some in group backtracks to term path
    module: |
      package test

      import future.keywords.or

      p if {
      	a or (some x in xs)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 8
        message: unexpected some keyword
  - note: errors/parse-logical-paren-errors/multi-statement needs explicit body
    module: |
      package test

      import future.keywords.and

      p if {
      	a and (x; y)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 10
        message: non-terminated expression
  - note: errors/parse-logical-paren-errors/empty not group
    module: |
      package test

      import future.keywords.not

      p if {
      	not ()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: empty parenthesized group
  - note: errors/parse-logical-paren-errors/logical group cannot be compared
    module: |
      package test

      import future.keywords.or

      p if {
      	(a or b) == c
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 11
        message: 'unexpected equal token: expected \n or ; or }'
