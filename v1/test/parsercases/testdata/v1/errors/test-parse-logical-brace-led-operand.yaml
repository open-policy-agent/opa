---
cases:
  - note: errors/parse-logical-brace-led-operand/lhs of and
    module: |
      package test

      import future.keywords.and

      p if {
      	{"a": 1} and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `and` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({"a": 1}) and ...`)'
  - note: errors/parse-logical-brace-led-operand/lhs of or
