---
cases:
  - note: errors/every/arbitrary term
    module: |
      package test

      p if {
      	every 10
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: expected `x[, y] in xs { ... }` expression'
  - note: errors/every/non-var value
    module: |
      package test

      p if {
      	every 10 in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 17
        message: 'unexpected { token: expected value to be a variable'
  - note: errors/every/non-var key
    module: |
      package test

      p if {
      	every 10, x in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 20
        message: 'unexpected { token: expected key to be a variable'
  - note: errors/every/arbitrary call
    module: |
      package test

      p if {
      	every f(10)
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: expected `x[, y] in xs { ... }` expression'
  - note: errors/every/no body
    module: |
      package test

      p if {
      	every x in xs
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: missing body'
  - note: errors/every/invalid body
    module: |
      package test

      p if {
      	every x in xs { + }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 18
        message: unexpected plus token
  - note: errors/every/not every
    module: |
      package test

      p if {
      	not every x in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 6
        message: 'unexpected every keyword: illegal negation of ''every'''
  - note: errors/every/invalid domain (internal.member_2)
    module: |
      package test

      p if {
      	every internal.member_2()
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: illegal domain'
  - note: errors/every/invalid domain (internal.member_3)
    module: |
      package test

      p if {
      	every internal.member_3()
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: illegal domain'
