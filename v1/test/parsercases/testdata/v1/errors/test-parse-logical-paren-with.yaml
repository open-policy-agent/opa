---
# Generated externalized tests from TestParseLogical_ParenWith
cases:
  - note: errors/parse-logical-paren-with/mid-group with before and
    module: |
      package test

      import future.keywords.and

      p if {
      	(a with input as v and b)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 5
        message: '`with` modifier is not allowed on operand of `and` (hint: Wrap the operand in `(...)` or `{...}` to scope, or move `with` after the `and` expression to apply it to the whole expression)'
  - note: errors/parse-logical-paren-with/mid-group with before or
    module: |
      package test

      import future.keywords.or

      p if {
      	(a with input as v or b)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 5
        message: '`with` modifier is not allowed on operand of `or` (hint: Wrap the operand in `(...)` or `{...}` to scope, or move `with` after the `or` expression to apply it to the whole expression)'
  - note: errors/parse-logical-paren-with/mid-group with inside not group
    module: |
      package test

      import future.keywords.and
      import future.keywords.not

      p if {
      	not (a with input as v and b)
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 9
        message: '`with` modifier is not allowed on operand of `and` (hint: Wrap the operand in `(...)` or `{...}` to scope, or move `with` after the `and` expression to apply it to the whole expression)'
