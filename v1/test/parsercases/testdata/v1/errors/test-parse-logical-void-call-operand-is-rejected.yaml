# Generated externalized tests from TestParseLogical_VoidCallOperandIsRejected
cases:
  - note: errors/parse-logical-void-call-operand-is-rejected/lhs of and
    module: |
      package test

      import future.keywords.and

      p if {
      	print("x") and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `and` cannot consist only of calls to `print` (hint: `print` produces no value and always succeeds, so the operand can never fail; move it out of the operand, or add an expression that can fail)'
