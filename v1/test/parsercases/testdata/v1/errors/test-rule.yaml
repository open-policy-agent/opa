---
cases:
  - note: errors/rule/empty body
    module: |
      package test

      f(_) = y {}
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 11
        message: found empty body
  - note: errors/rule/empty rule body
    module: |
      package test

      p {}
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 4
        message: found empty body
  - note: errors/rule/no output
    module: |
      package test

      f(_) := { "foo" = "bar" }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 17
        message: 'unexpected eq token: non-terminated set'
  - note: errors/rule/no output (2)
    module: |
      package test

      f := { "foo" = "bar" }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 14
        message: 'unexpected eq token: non-terminated set'
  - note: errors/rule/no output (3)
    module: |
      package test

      f[_] := { "foo" = "bar" }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 17
        message: 'unexpected eq token: non-terminated set'
  - note: errors/rule/no output (4)
    module: |
      package test

      default f :=
    want_errors:
      - code: rego_parse_error
        row: 4
        message: unexpected eof token
  - note: errors/rule/dangling semicolon
    module: |
      package test

      p { true; false; }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 18
        message: unexpected } token
  - note: errors/rule/default invalid rule name
    module: |
      package test

      default 0[0
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: unexpected default keyword
  - note: errors/rule/default invalid rule value
    module: |
      package test

      default a[0]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (must have a value)
  - note: errors/rule/default invalid rule head ref
    module: |
      package test

      default a = b.c.d
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain ref)
  - note: errors/rule/default invalid rule head call
    module: |
      package test

      default a = g(x)
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain call)
  - note: errors/rule/default invalid rule head builtin call
    module: |
      package test

      default a = upper("foo")
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain call)
  - note: errors/rule/default invalid rule head call (2)
    module: |
      package test

      default a = b
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain var)
  - note: errors/rule/default invalid function head ref
    module: |
      package test

      default f(x) = b.c.d
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain ref)
  - note: errors/rule/default invalid function head call
    module: |
      package test

      default f(x) = g(x)
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain call)
  - note: errors/rule/default invalid function head builtin call
    module: |
      package test

      default f(x) = upper("foo")
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain call)
  - note: errors/rule/default invalid function head call (2)
    module: |
      package test

      default f(x) = b
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (value cannot contain var)
  - note: errors/rule/default invalid function composite argument
    module: |
      package test

      default f([x]) = 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (arguments cannot contain array)
  - note: errors/rule/default invalid function number argument
    module: |
      package test

      default f(1) = 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (arguments cannot contain number)
  - note: errors/rule/default invalid function repeated vars
    module: |
      package test

      default f(x, x) = 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: illegal default rule (arguments cannot be repeated x)
  - note: errors/rule/extra braces
    module: |
      package test

      { a := 1 }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 5
        message: 'unexpected assign token: non-terminated set'
  - note: errors/rule/invalid rule name hyphen
    module: |
      package test

      a-b = x { x := 1 }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 2
        message: unexpected minus token
  - note: errors/rule/invalid rule body no separator
    module: |
      package test

      p { a = "foo"bar }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 14
        message: 'unexpected identifier token: expected \n or ; or }'
  - note: errors/rule/invalid rule body no newline
    module: |
      package test

      p { a b c }
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 7
        message: 'unexpected identifier token: expected \n or ; or }'
