---
# Generated externalized tests from TestRefTerms
cases:
  - note: errors/ref-terms/missing component 1
    module: |
      package test

      p := foo.
    want_errors:
      - code: rego_parse_error
        row: 4
        message: 'unexpected whitespace token: expected identifier'
  - note: errors/ref-terms/missing component 2
    module: |
      package test

      p := foo[].bar
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 10
        message: unexpected ] token
  - note: errors/ref-terms/invalid composite operand
    module: |
      package test

      p := foo[1,2]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 11
        message: 'unexpected , token: expected ['
  - note: errors/ref-terms/invalid call
    module: |
      package test

      p := bar(..
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 11
        message: 'unexpected . token: expected number'
  - note: errors/ref-terms/invalid ref
    module: |
      package test

      p := bar[..
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 11
        message: 'unexpected . token: expected number'
  - note: errors/ref-terms/invalid ref head type number
    module: |
      package test

      p := 0[0]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 6
        message: illegal ref (head cannot be number)
  - note: errors/ref-terms/invalid ref head type number (float)
    module: |
      package test

      p := 1.2[0]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 6
        message: illegal ref (head cannot be number)
  - note: errors/ref-terms/invalid ref head type string
    module: |
      package test

      p := "foo"[0]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 6
        message: illegal ref (head cannot be string)
  - note: errors/ref-terms/invalid ref head type string (dot)
    module: |
      package test

      p := "foo".bar
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 6
        message: illegal ref (head cannot be string)
