---
# Generated externalized tests from TestStringTerms
cases:
  - note: terms/string-terms/empty (module)
    module: |
      package test

      p := ""
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": true
                }
              }
            ],
            "head": {
              "assign": true,
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "string",
                "value": ""
              }
            }
          }
        ]
      }
