---
# Generated externalized tests from TestArrayFail
cases:
  - note: terms/array-fail/non-terminated 1 (module)
    module: |
      package test

      p := [foo, bar
    want_errors:
      - code: rego_parse_error
        row: 4
        message: 'unexpected eof token: expected "," or "]"'
  - note: terms/array-fail/non-terminated 1 (body)
    body: |
      [foo, bar
    want_errors:
      - code: rego_parse_error
        row: 2
        message: 'unexpected eof token: expected "," or "]"'
  - note: terms/array-fail/non-terminated 2 (module)
    module: |
      package test

      p := [foo, bar,
    want_errors:
      - code: rego_parse_error
        row: 4
        message: unexpected eof token
  - note: terms/array-fail/non-terminated 2 (body)
    body: |
      [foo, bar,
    want_errors:
      - code: rego_parse_error
        row: 2
        message: unexpected eof token
  - note: terms/array-fail/missing separator (module)
    module: |
      package test

      p := [foo bar]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 11
        message: 'unexpected identifier token: expected "," or "]"'
  - note: terms/array-fail/missing separator (body)
    body: |
      [foo bar]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 6
        message: 'unexpected identifier token: expected "," or "]"'
  - note: terms/array-fail/missing start (module)
    module: |
      package test

      p := foo, bar, baz]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 9
        message: unexpected , token
  - note: terms/array-fail/missing start (body)
    body: |
      foo, bar, baz]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 4
        message: unexpected , token
  - note: terms/array-fail/bad term (module)
    module: |
      package test

      p := [!!!]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 7
        message: illegal ! character
  - note: terms/array-fail/bad term (body)
    body: |
      [!!!]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 2
        message: illegal ! character
  - note: terms/array-fail/double comma (module)
    module: |
      package test

      p := [a,,b]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 9
        message: unexpected , token
  - note: terms/array-fail/double comma (body)
    body: |
      [a,,b]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 4
        message: unexpected , token
  - note: terms/array-fail/leading double comma (module)
    module: |
      package test

      p := [,,a]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 8
        message: unexpected , token
  - note: terms/array-fail/leading double comma (body)
    body: |
      [,,a]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 3
        message: unexpected , token
  - note: terms/array-fail/trailing double comma (module)
    module: |
      package test

      p := [a,,]
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 9
        message: unexpected , token
  - note: terms/array-fail/trailing double comma (body)
    body: |
      [a,,]
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 4
        message: unexpected , token
