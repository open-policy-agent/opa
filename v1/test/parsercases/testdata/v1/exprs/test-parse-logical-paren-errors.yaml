  - note: exprs/parse-logical-paren-errors/logical group cannot be compared (module)
    module: |
      package test

      import future.keywords.or

      p if {
      	(a or b) == c
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 11
        message: 'unexpected equal token: expected \n or ; or }'
  - note: exprs/parse-logical-paren-errors/logical group cannot be compared (body)
    body: |
      (a or b) == c
    imports:
      - future.keywords.or
    want_errors:
