    imports:
      - future.keywords.and
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 9
        message: non-terminated expression
  - note: exprs/parse-logical-paren-errors/empty not group (module)
    module: |
      package test

      import future.keywords.not

      p if {
      	not ()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: empty parenthesized group
  - note: exprs/parse-logical-paren-errors/empty not group (body)
    body: |
