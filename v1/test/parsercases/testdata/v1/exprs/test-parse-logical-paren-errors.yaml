---
# Generated externalized tests from TestParseLogical_ParenErrors
cases:
  - note: exprs/parse-logical-paren-errors/empty group (module)
    module: |
      package test

      import future.keywords.or

      p if {
      	a or ()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: empty parenthesized group
  - note: exprs/parse-logical-paren-errors/empty group (body)
    body: |
      a or ()
    imports:
      - future.keywords.or
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 6
        message: empty parenthesized group
  - note: exprs/parse-logical-paren-errors/parens cannot wrap a body with logical content (module)
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and ({b or c})
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 8
        message: '`(...)` in an operand position cannot contain a body (hint: drop the parens to keep the body: `{b or c}`)'
  - note: exprs/parse-logical-paren-errors/parens cannot wrap a body with logical content (body)
    body: |
      a and ({b or c})
    imports:
      - future.keywords.and
      - future.keywords.or
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 7
        message: '`(...)` in an operand position cannot contain a body (hint: drop the parens to keep the body: `{b or c}`)'
  - note: exprs/parse-logical-paren-errors/unterminated group (module)
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and (b or c
      }
    want_errors:
      - code: rego_parse_error
        row: 8
        col: 1
        message: expected ) to close parenthesized group
  - note: exprs/parse-logical-paren-errors/unterminated group (body)
    body: |
      a and (b or c
    imports:
      - future.keywords.and
      - future.keywords.or
    want_errors:
      - code: rego_parse_error
        row: 2
        message: expected ) to close parenthesized group
  - note: exprs/parse-logical-paren-errors/non-logical group operand backtracks to term path (module)
    module: |
      package test

      import future.keywords.or

      p if {
      	a or (x = 1)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 10
        message: non-terminated expression
  - note: exprs/parse-logical-paren-errors/non-logical group operand backtracks to term path (body)
    body: |
      a or (x = 1)
    imports:
      - future.keywords.or
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 9
        message: non-terminated expression
  - note: exprs/parse-logical-paren-errors/empty group at statement start backtracks to term (module)
    module: |
      package test

      p if {
      	() and a
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 3
        message: unexpected ) token
  - note: exprs/parse-logical-paren-errors/empty group at statement start backtracks to term (body)
    body: |
      () and a
    want_errors:
      - code: rego_parse_error
        row: 1
        col: 2
        message: unexpected ) token
  - note: exprs/parse-logical-paren-errors/group opening with an operator (module)
    module: |
      package test

      import future.keywords.and
      import future.keywords.or

      p if {
      	a and ( or b)
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 10
        message: unexpected or keyword
  - note: exprs/parse-logical-paren-errors/group opening with an operator (body)
    body: |
