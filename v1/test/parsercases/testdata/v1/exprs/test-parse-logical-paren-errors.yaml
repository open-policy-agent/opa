        message: non-terminated expression
  - note: exprs/parse-logical-paren-errors/some in group backtracks to term path (module)
    module: |
      package test

      import future.keywords.or

      p if {
      	a or (some x in xs)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 8
        message: unexpected some keyword
  - note: exprs/parse-logical-paren-errors/some in group backtracks to term path (body)
    body: |
