---
# Generated externalized tests from TestParseLogical_BraceLedOperandHintExtent
cases:
  - note: exprs/parse-logical-brace-led-operand-hint-extent/and, lhs
    module: |
      package test

      import future.keywords.and

      p if {
      	{1, 2} & input.s == set() and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `and` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({1, 2} & input.s == set()) and ...`)'
  - note: exprs/parse-logical-brace-led-operand-hint-extent/and, rhs
    module: |
      package test

      import future.keywords.and

      p if {
      	z and {1, 2} & input.s == set()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 8
        message: 'operand of `and` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({1, 2} & input.s == set()) and ...`)'
  - note: exprs/parse-logical-brace-led-operand-hint-extent/or, lhs
    module: |
      package test

      import future.keywords.or

      p if {
      	{1, 2} & input.s == set() or z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `or` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({1, 2} & input.s == set()) or ...`)'
  - note: exprs/parse-logical-brace-led-operand-hint-extent/or, rhs
    module: |
      package test

      import future.keywords.or

      p if {
      	z or {1, 2} + 1 == 2
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: 'operand of `or` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({1, 2} + 1 == 2) or ...`)'
  - note: exprs/parse-logical-brace-led-operand-hint-extent/not
    module: |
      package test

      import future.keywords.not

      p if {
      	not {1, 2} & input.s == set()
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: '`{...}` in an operand position must contain expression(s), got: set (hint: write `not ({1, 2} & input.s == set())` to negate the value, or `not {{1, 2} & input.s == set()}` for a body holding it)'
  - note: exprs/parse-logical-brace-led-operand-hint-extent/not, ref into object
    module: |
      package test

      import future.keywords.not

      p if {
      	not {"a": 1}["a"]
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: '`{...}` in an operand position must contain expression(s), got: ref (hint: write `not ({"a": 1}["a"])` to negate the value, or `not {{"a": 1}["a"]}` for a body holding it)'
