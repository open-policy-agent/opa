  - note: exprs/every/arbitrary term (module)
    module: |
      package test

      p if {
      	every 10
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: expected `x[, y] in xs { ... }` expression'
  - note: exprs/every/arbitrary term (body)
    body: |
      every 10
    want_errors:
      - code: rego_parse_error
        row: 2
        message: 'unexpected eof token: expected `x[, y] in xs { ... }` expression'
