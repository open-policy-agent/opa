      	every k, v in [1,2] { true }
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "key": {
                    "type": "var",
                    "value": "k"
                  },
                  "value": {
                    "type": "var",
                    "value": "v"
                  },
                  "domain": {
                    "type": "array",
                    "value": [
                      {
                        "type": "number",
                        "value": 1
                      },
                      {
                        "type": "number",
                        "value": 2
                      }
                    ]
                  },
                  "body": [
                    {
                      "index": 0,
                      "terms": {
                        "type": "boolean",
                        "value": true
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
  - note: exprs/every/arbitrary term
    module: |
      package test

      p if {
      	every 10
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: expected `x[, y] in xs { ... }` expression'
  - note: exprs/every/non-var value
    module: |
      package test

      p if {
      	every 10 in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 17
        message: 'unexpected { token: expected value to be a variable'
  - note: exprs/every/non-var key
    module: |
      package test

      p if {
      	every 10, x in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 20
        message: 'unexpected { token: expected key to be a variable'
  - note: exprs/every/arbitrary call
    module: |
      package test

      p if {
      	every f(10)
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: expected `x[, y] in xs { ... }` expression'
  - note: exprs/every/no body
    module: |
      package test

      p if {
      	every x in xs
      }
    want_errors:
      - code: rego_parse_error
        row: 5
        col: 1
        message: 'unexpected } token: missing body'
  - note: exprs/every/invalid body
    module: |
      package test

      p if {
      	every x in xs { + }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 18
        message: unexpected plus token
  - note: exprs/every/not every
    module: |
      package test

      p if {
      	not every x in xs { true }
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 6
        message: 'unexpected every keyword: illegal negation of ''every'''
