---
# Generated externalized tests from TestEvery
cases:
  - note: exprs/every/simple
    module: |
      package test

      p if {
      	every x in xs { true }
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "key": null,
                  "value": {
                    "type": "var",
                    "value": "x"
                  },
                  "domain": {
                    "type": "var",
                    "value": "xs"
                  },
                  "body": [
                    {
                      "index": 0,
                      "terms": {
                        "type": "boolean",
                        "value": true
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
