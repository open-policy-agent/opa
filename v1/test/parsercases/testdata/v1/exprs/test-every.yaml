---
# Generated externalized tests from TestEvery
cases:
  - note: exprs/every/simple (module)
    module: |
      package test

      p if {
      	every x in xs { true }
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "body": [
              {
                "index": 0,
                "terms": {
                  "body": [
                    {
                      "index": 0,
                      "terms": {
                        "type": "boolean",
                        "value": true
                      }
                    }
                  ],
                  "domain": {
                    "type": "var",
                    "value": "xs"
                  },
                  "key": null,
                  "value": {
                    "type": "var",
                    "value": "x"
                  }
                }
              }
            ],
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            }
          }
        ]
      }
