---
# Generated externalized tests from TestSomeDeclExpr
cases:
  - note: exprs/some-decl-expr/one
    module: |
      package test

      p if {
      	some x
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "body": [
              {
                "index": 0,
                "terms": {
                  "symbols": [
                    {
                      "type": "var",
                      "value": "x"
                    }
                  ]
                }
              }
            ],
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            }
          }
        ]
      }
