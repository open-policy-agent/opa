---
# Generated externalized tests from TestParseLogical_EmptyBraceOperand
cases:
  - note: exprs/parse-logical-empty-brace-operand/lhs of and
    module: |
      package test

      import future.keywords.and

      p if {
      	{} and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/rhs of and
    module: |
      package test

      import future.keywords.and

      p if {
      	z and {}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 9
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/lhs of or
    module: |
      package test

      import future.keywords.or

      p if {
      	{} or z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/rhs of or
    module: |
      package test

      import future.keywords.or

      p if {
      	z or {}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 8
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/both operands
    module: |
      package test

      import future.keywords.and

      p if {
      	{} and {}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/whitespace only
    module: |
      package test

      import future.keywords.and

      p if {
      	{ } and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/after not
    module: |
      package test

      import future.keywords.not

      p if {
      	not {}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/after not, as an operand
    module: |
      package test

      import future.keywords.and
      import future.keywords.not

      p if {
      	z and not {}
      }
    want_errors:
      - code: rego_parse_error
        row: 7
        col: 13
        message: found empty body
  - note: exprs/parse-logical-empty-brace-operand/leading a comparison
    module: |
      package test

      import future.keywords.and

      p if {
      	{} == x and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `and` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({} == x) and ...`)'
  - note: exprs/parse-logical-empty-brace-operand/leading a ref
    module: |
      package test

      import future.keywords.and

      p if {
      	{}[_] and z
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: 'operand of `and` cannot begin with `{` unless the braces hold a body (hint: wrap the operand to keep the value: `({}[_]) and ...`)'
  - note: exprs/parse-logical-empty-brace-operand/parenthesized lhs is the empty object
