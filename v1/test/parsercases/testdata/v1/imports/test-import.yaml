  - note: imports/import/white space
    module: |
      package test

      import input.foo.bar["white space"]
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "imports": [
          {
            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "input"
                },
                {
                  "type": "string",
                  "value": "foo"
                },
                {
                  "type": "string",
                  "value": "bar"
                },
                {
                  "type": "string",
