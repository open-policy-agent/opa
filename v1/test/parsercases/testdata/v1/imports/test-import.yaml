            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "input"
                },
                {
                  "type": "string",
                  "value": "foo"
                }
              ]
            },
            "alias": "bar"
          }
        ]
      }
  - note: imports/import/multiple alias
