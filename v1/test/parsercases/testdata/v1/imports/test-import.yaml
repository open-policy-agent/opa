---
# Generated externalized tests from TestImport
cases:
  - note: imports/import/single-input
    module: |
      package test

      import input
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "imports": [
          {
            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "input"
                }
              ]
            }
          }
        ]
      }
