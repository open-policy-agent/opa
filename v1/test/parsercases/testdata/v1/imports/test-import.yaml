---
# Generated externalized tests from TestImport
cases:
  - note: imports/import/single-input
    module: |
      package test

      import input
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "imports": [
          {
            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "input"
                }
              ]
            }
          }
        ]
      }
  - note: imports/import/single-data
    module: |
      package test

      import data
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "imports": [
          {
            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "data"
                }
              ]
            }
          }
        ]
      }
  - note: imports/import/multiple
    module: |
      package test

      import input.foo.bar.baz
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "imports": [
          {
            "path": {
              "type": "ref",
              "value": [
                {
                  "type": "var",
                  "value": "input"
                },
                {
                  "type": "string",
                  "value": "foo"
                },
                {
                  "type": "string",
                  "value": "bar"
                },
                {
                  "type": "string",
                  "value": "baz"
                }
              ]
            }
          }
        ]
      }
