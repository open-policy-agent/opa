  - note: logical/space before the paren is not a call, keyword inactive
    module: |
      package test

      p if {
      	x := or ({1}, {2})
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 10
        message: 'unexpected ( token: expected \n or ; or }'
  - note: logical/space before the paren is not a call, keyword active
