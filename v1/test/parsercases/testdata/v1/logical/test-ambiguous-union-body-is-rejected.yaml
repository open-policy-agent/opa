        row: 4
        col: 10
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `not ({x | x})` for the comprehension, or `not {(x | x)}` for the set union)'
  - note: logical/ambiguous-union-body-is-rejected/union body, 'and' operand
    module: |
      package test

      import future.keywords.or

      import future.keywords.and
      p if { x and {a | b} }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 14
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `({a | b})` for the comprehension, or `{(a | b)}` for the set union)'
  - note: logical/ambiguous-union-body-is-rejected/union body, 'or' operand
    module: |
      package test

      import future.keywords.and

      import future.keywords.or
      p if { {a | b} or x }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 8
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `({a | b})` for the comprehension, or `{(a | b)}` for the set union)'
  - note: logical/ambiguous-union-body-is-rejected/union body, operand inside a negated group
    module: |
      package test

      import future.keywords.not
      import future.keywords.and
      import future.keywords.or
      p if { not ({a | b} or y) }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 13
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `({a | b})` for the comprehension, or `{(a | b)}` for the set union)'
