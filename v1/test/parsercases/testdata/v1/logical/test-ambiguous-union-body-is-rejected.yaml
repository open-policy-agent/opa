---
# Generated externalized tests from TestAmbiguousUnionBodyIsRejected
cases:
  - note: logical/ambiguous-union-body-is-rejected/no import, comprehension, braced rule
    module: |
      package test

      p if { not {x | x} }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "body": [
              {
                "index": 0,
                "negated": true,
                "terms": {
                  "type": "setcomprehension",
                  "value": {
                    "body": [
                      {
                        "index": 0,
                        "terms": {
                          "type": "var",
                          "value": "x"
                        }
                      }
                    ],
                    "term": {
                      "type": "var",
                      "value": "x"
                    }
                  }
                }
              }
            ],
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "value": {
                "type": "boolean",
                "value": true
              }
            }
          }
        ]
      }
  - note: logical/ambiguous-union-body-is-rejected/union body, braced rule
    module: |
      package test

      import future.keywords.not
      p if { not {x | x} }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 12
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `not ({x | x})` for the comprehension, or `not {(x | x)}` for the set union)'
  - note: logical/ambiguous-union-body-is-rejected/no import, comprehension, one-line rule
