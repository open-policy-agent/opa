  - note: modules/rule-from-body/multiple expressions
    module: |
      package a.b.c

      pi = 3.14159; pi > 3
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: multiple expressions cannot be used for rule head
  - note: modules/rule-from-body/non-equality
    module: |
      package a.b.c

      pi > 3
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: rule name conflicts with built-in function
  - note: modules/rule-from-body/non-var name
    module: |
      package a.b.c

      "pi" = 3
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: string cannot be used for rule name
  - note: modules/rule-from-body/with expr
    module: |
      package a.b.c

      foo = input with input as 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: expressions using with keyword cannot be used for rule head
  - note: modules/rule-from-body/negated
    module: |
      package a.b.c

      not p = 1
    want_errors:
      - code: rego_parse_error
        row: 3
        col: 1
        message: negated expressions cannot be used for rule head
