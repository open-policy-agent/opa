---
# Generated externalized tests from TestRuleElseRefHeads
cases:
  - note: modules/rule-else-ref-heads/simple ref head
    module: |
      package test

      a.b.c := 1 if false
      else := 2
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "else": {
              "head": {
                "ref": [
                  {
                    "type": "var",
                    "value": "a"
                  },
                  {
                    "type": "string",
                    "value": "b"
                  },
                  {
                    "type": "string",
                    "value": "c"
                  }
                ],
                "value": {
                  "type": "number",
                  "value": 2
                },
                "assign": true
              },
              "body": [
                {
                  "index": 0,
                  "terms": {
                    "type": "boolean",
                    "value": true
                  }
                }
              ]
            },
            "head": {
              "ref": [
                {
                  "type": "var",
                  "value": "a"
                },
                {
                  "type": "string",
                  "value": "b"
                },
                {
                  "type": "string",
                  "value": "c"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": false
                }
              }
            ]
          }
        ]
      }
  - note: modules/rule-else-ref-heads/multi-value ref head
    module: |
      package test

      a.b.c contains 1 if false
      else := 2
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 1
        message: else keyword cannot be used on multi-value rules
  - note: modules/rule-else-ref-heads/single-value ref head with var
    module: |
      package test

      a.b[x] := 1 if false
      else := 2
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 1
        message: else keyword cannot be used on rules with variables in head
  - note: modules/rule-else-ref-heads/single-value general ref head with var
    module: |
      package test

      a.b[x].c := 1 if false
      else := 2
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 1
        message: else keyword cannot be used on rules with variables in head
  - note: modules/rule-else-ref-heads/single-value ref head with length 1 (last is var)
    module: |
      package test

      a := 1 if false
      else := 2
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "else": {
              "head": {
                "name": "a",
                "ref": [
                  {
                    "type": "var",
                    "value": "a"
                  }
                ],
                "value": {
                  "type": "number",
                  "value": 2
                },
                "assign": true
              },
              "body": [
                {
                  "index": 0,
                  "terms": {
                    "type": "boolean",
                    "value": true
                  }
                }
              ]
            },
            "head": {
              "name": "a",
              "ref": [
                {
                  "type": "var",
                  "value": "a"
                }
              ],
              "value": {
                "type": "number",
                "value": 1
              },
              "assign": true
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "type": "boolean",
                  "value": false
                }
              }
            ]
          }
        ]
      }
