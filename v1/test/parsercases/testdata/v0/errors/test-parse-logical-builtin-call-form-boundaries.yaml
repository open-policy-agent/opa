---
cases:
  - note: errors/parse-logical-builtin-call-form-boundaries/bare or, assigned
    rego_version: v0
    module: |
      package test

      import future.keywords.or

      p {
      	x := or
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: unexpected or keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/bare and, assigned
    rego_version: v0
    module: |
      package test

      import future.keywords.and

      p {
      	x := and
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 7
        message: unexpected and keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/bare or, call argument
    rego_version: v0
    module: |
      package test

      import future.keywords.or

      p {
      	f(or)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 4
        message: unexpected or keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/bare and, comparison lhs
    rego_version: v0
    module: |
      package test

      import future.keywords.and

      p {
      	and == x
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: unexpected and keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/or call, space before paren
    rego_version: v0
    module: |
      package test

      import future.keywords.or

      p {
      	or (a, b)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: unexpected or keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/and call, space before paren
    rego_version: v0
    module: |
      package test

      import future.keywords.and

      p {
      	and (a, b)
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 2
        message: unexpected and keyword
  - note: errors/parse-logical-builtin-call-form-boundaries/or call, operator position
    rego_version: v0
    module: |
      package test

      import future.keywords.or

      p {
      	x or or y
      }
    want_errors:
