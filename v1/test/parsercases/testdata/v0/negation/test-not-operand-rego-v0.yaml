  - note: negation/not-operand-rego-v0/parens cannot wrap a body
    module: |
      package test

      import future.keywords.not

      p {
      	not ({x; y})
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: '`(...)` in an operand position cannot contain a body (hint: drop the parens to keep the body: `not {x; y}`)'
  - note: negation/not-operand-rego-v0/comprehension read as a union is rejected
    module: |
      package test

      import future.keywords.not

      p {
      	not {x | x}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: 'ambiguous `{ ... | ... }` operand: read as a body holding a set-union expression, not as a comprehension (hint: write `not ({x | x})` for the comprehension, or `not {(x | x)}` for the set union)'
  - note: negation/not-operand-rego-v0/braces cannot hold an object
    module: |
      package test

      import future.keywords.not

      p {
      	not {"a": 1}
      }
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 6
        message: '`{...}` in an operand position must contain expression(s), got: object (hint: write `not ({"a": 1})` to negate the value, or `not {{"a": 1}}` for a body holding it)'
