---
# Generated externalized tests from TestMembershipExprHintWithLogicalKeywords
cases:
  - note: exprs/membership-expr-hint-with-logical-keywords/membership on the lhs of `and`
    module: |
      package test

      import future.keywords.and
      p { x in xs and y }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 7
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `x in xs` expressions)'
  - note: exprs/membership-expr-hint-with-logical-keywords/membership on the rhs of `and`
    module: |
      package test

      import future.keywords.and
      p { y and x in xs }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 13
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `x in xs` expressions)'
  - note: exprs/membership-expr-hint-with-logical-keywords/membership on the rhs of `or`
    module: |
      package test

      import future.keywords.or
      p { y or x in xs }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 12
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `x in xs` expressions)'
  - note: exprs/membership-expr-hint-with-logical-keywords/membership inside a not-body
    module: |
      package test

      import future.keywords.not
      p { not { x in xs } }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 13
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `x in xs` expressions)'
