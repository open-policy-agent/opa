---
# Generated externalized tests from TestSomeDeclExpr
cases:
  - note: exprs/some-decl-expr/whitespace separated
    rego_version: v0
    module: |
      package test

      p[x] {
      	some x
      	q[x]
      }
    want_ast: |
      {
        "package": {
          "path": [
            {
              "type": "var",
              "value": "data"
            },
            {
              "type": "string",
              "value": "test"
            }
          ]
        },
        "rules": [
          {
            "head": {
              "name": "p",
              "ref": [
                {
                  "type": "var",
                  "value": "p"
                }
              ],
              "key": {
                "type": "var",
                "value": "x"
              }
            },
            "body": [
              {
                "index": 0,
                "terms": {
                  "symbols": [
                    {
                      "type": "var",
                      "value": "x"
                    }
                  ]
                }
              },
              {
                "index": 1,
                "terms": {
                  "type": "ref",
                  "value": [
                    {
                      "type": "var",
                      "value": "q"
                    },
                    {
                      "type": "var",
                      "value": "x"
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
