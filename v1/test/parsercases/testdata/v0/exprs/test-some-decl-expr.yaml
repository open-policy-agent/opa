  - note: exprs/some-decl-expr/some x in ... usage is hinted properly
    rego_version: v0
    module: |
      package test

      p contains x if {
      	some x in {"foo": "bar"}
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 9
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `some x in xs` expressions)'
  - note: exprs/some-decl-expr/some x, y in ... usage is hinted properly
    rego_version: v0
    module: |
      package test

      p[y] = x if {
      	some x, y in {"foo": "bar"}
      }
    want_errors:
      - code: rego_parse_error
        row: 4
        col: 12
        message: 'unexpected identifier token: expected \n or ; or } (hint: `import future.keywords.in` for `some x in xs` expressions)'
