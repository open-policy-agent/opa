---
cases:
  # From TestRuleFromBodyRefs' "errors" subtests, which parse a module inline and
  # check the message rather than going through an assertion helper, so there is
  # nothing for the extractor to read. The `if` and `contains` imports carry over
  # the parser options that test runs under.
  - note: modules/rule-from-body-refs/naked data ref
    rego_version: v0
    module: |
      package a.b.c

      import future.keywords.contains
      import future.keywords.if

      data
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 1
        message: refs cannot be used for rule head
  - note: modules/rule-from-body-refs/naked input ref
    rego_version: v0
    module: |
      package a.b.c

      import future.keywords.contains
      import future.keywords.if

      input
    want_errors:
      - code: rego_parse_error
        row: 6
        col: 1
        message: refs cannot be used for rule head
