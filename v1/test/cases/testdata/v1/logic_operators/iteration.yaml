---
# Operand bodies with internal enumeration.
cases:
  - note: "logic_op/iteration: and"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          { some n in [1, 2, 3]; n > 0 } and true
        }
    want_result:
      - x: true
  - note: "logic_op/iteration: and lhs would yield multiple successes, comprehension emits once"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p := [1 |
          { some n in [1, 2, 3]; n > 0 } and true
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: and rhs would yield multiple successes, comprehension emits once"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p := [1 |
          true and { some n in [1, 2, 3]; n > 0 }
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: and lhs+rhs would yield multiple successes, comprehension emits once"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p := [1 |
          { some n in [1, 2, 3]; n > 0 } and { some n in [4, 5, 6]; n > 0 }
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: or lhs would yield multiple successes, comprehension emits once"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.or

        p := [1 |
          { some n in [1, 2, 3]; n > 0 } or false
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: or rhs would yield multiple successes, comprehension emits once"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.or

        p := [1 |
          false or { some n in [1, 2, 3]; n > 0 }
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: enumeration inside operand body, no fail-and-retry"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        # Only one needs to succeed
        p := [1 |
          { some n in [-1, 2, 3, 4]; n == 2 } and true
        ]
    want_result:
      - x: [1]
  - note: "logic_op/iteration: enumeration inside operand body, all fail"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        # All fail
        p := [1 |
          { some n in [-1, 2, 3, 4]; n == 42 } and true
        ]
    want_result:
      - x: []
  - note: "logic_op/iteration: not around or with iteration"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.or
        import future.keywords.not

        # not body iterates xs; succeeds iff NO element satisfies either branch
        p if {
          not { some n in input.xs; n < 0 or n > 100 }
        }
    input:
      xs: [0, 5, 99]
    want_result:
      - x: true
  - note: "logic_op/iteration: not around or with iteration, one element matches"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.or
        import future.keywords.not

        p if {
          not { some n in input.xs; n < 0 or n > 100 }
        }
    input:
      xs: [0, 5, 200]
    want_result: []
  - note: "logic_op/iteration: not around and with iteration"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and
        import future.keywords.not

        # Succeeds iff no n in xs is both >0 and <10
        p if {
          not { some n in input.xs; n > 0 and n < 10 }
        }
    input:
      xs: [-1, 0, 20]
    want_result:
      - x: true
  - note: "logic_op/iteration: not around and with iteration, one element matches"
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and
        import future.keywords.not

        p if {
          not { some n in input.xs; n > 0 and n < 10 }
        }
    input:
      xs: [-1, 0, 5]
    want_result: []
