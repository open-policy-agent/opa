---
cases:
  - note: "aggregates/sort: values of all types except sets"
    query: data.test.p = x
    modules:
      - |
        package test

        p := sort([{}, [], "a", 1, true, null, false])
    want_result:
      - x: [null, false, true, 1, "a", [], {}]
  - note: "aggregates/sort: an object sorts before a set"
    query: data.test.p = x
    modules:
      - |
        package test

        p := sort([{1}, {"a": 1}])
    want_result:
      - x: [{"a": 1}, [1]]
