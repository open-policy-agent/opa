---
cases:
  - note: netcidrcontains/network contains itself /80
    query: data.generated.p = x
    modules:
      - |
        package generated

        p contains x if {
        	net.cidr_contains("::/80", "::/80", x)
        }
    data: {}
    want_result:
      - x:
          - true
    sort_bindings: true
