---
cases:
  - note: "netcidrcontainsmatches/bare ip address is not a cidr"
    query: data.test.p = x
    modules:
      - |
        package test

        p := net.cidr_contains_matches("10.1.2.3", ["10.1.2.3"])
    want_error_code: eval_builtin_error
    want_error: "invalid CIDR address: 10.1.2.3"
    strict_error: true
  - note: "netcidrcontainsmatches/bare ip address as a match"
    query: data.test.p = x
    modules:
      - |
        package test

        p := net.cidr_contains_matches(["10.1.2.0/24"], ["10.1.2.3"])
    want_result:
      - x: [[0, 0]]
