---
cases:
  - note: functionerrors/function output conflict single
    query: data.test1.r = x
    modules:
      - |
        package test1

        p(a) := y if {
        	y = a[_]
        }

        r := y if {
        	data.test1.p([1, 2, 3], y)
        }
    want_error_code: eval_conflict_error
    want_error: function data.test1.p produced conflicting values for the same inputs
  - note: functionerrors/function output conflict, used as boolean
    query: data.test.r = x
    modules:
      - |
        package test

        f(_) := true

        f(_) := false

        r if {
        	data.test.f(1)
        }
    want_error_code: eval_conflict_error
    want_error: function data.test.f produced conflicting values for the same inputs
