---
cases:
  - note: comparisonexpr/decimals order like the numbers they denote
    query: data.generated.p = x
    modules:
      - |
        package generated

        cases := {
        	"int, fraction": [3, 3.5],
        	"fraction, fraction": [3.25, 3.5],
        	"trailing zero": [3.50, 3.5],
        	"exponent": [1e2, 100],
        	"exponent, fraction": [1E+2, 100.0],
        	"negative exponent": [1e-1, 0.10],
        	"close": [0.1, 0.10000000000001],
        	"signs": [-2.5, 2.5],
        	"negatives": [-2.5, -2.25],
        	"negative zero": [-0, 0],
        	"zero, fraction": [0.0, 0.001],
        	"negative fraction, zero": [-0.001, 0],
        	"leading zeros after the point": [0.000000000000001, 0.000000000000002],
        	"fewer leading zeros": [0.01, 0.001],
        	"fewer leading zeros, negative": [-0.5, -0.05],
        	"zero, negative": [0, -0.001],
        	"negative zero, negative": [-0, -2.5],
        	"15 digits": [123456789012345, 123456789012345.5],
        	"15 digits, exponent": [999999999999999, 1e15],
        	"magnitudes": [1e299, 1e-299],
        	"negative magnitudes": [-1e299, 1e-299],
        	"beyond float64 exponent": [1e400, 1e399],
        	"tiny": [1e-400, 0],
        	"more than 15 digits": [0.1234567890123456789, 0.1234567890123456788],
        	"integers beyond int64": [1234567890123456789012, 1234567890123456789013],
        }

        p := {label: order(pair[0], pair[1]) | some label, pair in cases}

        order(a, b) := -1 if lt(a, b)

        order(a, b) := 1 if gt(a, b)

        order(a, b) := 0 if equal(a, b)
    data: {}
    want_result:
      - x:
          int, fraction: -1
          fraction, fraction: -1
          trailing zero: 0
          exponent: 0
          exponent, fraction: 0
          negative exponent: 0
          close: -1
          signs: -1
          negatives: -1
          negative zero: 0
          zero, fraction: -1
          negative fraction, zero: -1
          leading zeros after the point: -1
          fewer leading zeros: 1
          fewer leading zeros, negative: -1
          zero, negative: 1
          negative zero, negative: 1
          15 digits: -1
          15 digits, exponent: -1
          magnitudes: 1
          negative magnitudes: -1
          beyond float64 exponent: 1
          tiny: 1
          more than 15 digits: 1
          integers beyond int64: -1
  - note: comparisonexpr/decimals are the same number as a set member, object key and sort position
    query: data.generated.p = x
    modules:
      - |
        package generated

        p := {
        	"set": count({3.5, 3.50, 35e-1, 0.35e1}),
        	"set member": 3.50 in {3.5},
        	"object key": {3.5: "found"}[3.50],
        	"sorted": sort([3.5, 3, 3.25, -2.5, 3.50, 1e0, 0.5]),
        	"max": max([3, 3.5, 3.25, 3.4999]),
        	"min": min([3, 3.5, 2.75, 2.7499]),
        }
    data: {}
    want_result:
      - x:
          set: 1
          set member: true
          object key: found
          sorted: [-2.5, 0.5, 1, 3, 3.25, 3.5, 3.5]
          max: 3.5
          min: 2.7499
